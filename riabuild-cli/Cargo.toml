[package]
name = "riabuild-cli"
# Not the product version, and never bumped. riabuild is versioned by release
# date (`2026.08.04`), which Cargo cannot express — semver forbids the leading
# zeros. The real version is injected from the git tag as RIABUILD_VERSION and
# read in cli.rs; this field only exists because Cargo requires one.
version = "0.0.0"
edition = "2024"
description = "Sets up a Clubria developer's machine and opens the Clubria environment"
homepage = "https://riabuild.clubria.com"
repository = "https://github.com/Clubria/riabuild"
# riabuild is distributed through the Homebrew tap, never crates.io.
publish = false

[[bin]]
name = "riabuild"
path = "src/main.rs"

# Every developer downloads this binary over a laptop connection, so the release
# profile optimises for what ships rather than for build time.
#
# `strip` is deliberate but not sufficient on its own: on Apple silicon every
# binary must carry a signature, rustc ad-hoc signs one at link time, and
# stripping afterwards can invalidate it — the failure mode is `zsh: killed`
# with no further explanation. The release workflow re-signs after building for
# exactly that reason.
[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

# A panic in a provisioner is the worst failure it has: it prints a Rust
# backtrace on a developer's laptop, says nothing about what riabuild was doing,
# and leaves the machine half-set-up with no advice on whether re-running is
# safe. Every reachable error must instead become a `Failure` (see `ui.rs`),
# which carries what was attempted, the command, the detail, one next action,
# and whether a re-run is safe.
#
# `unwrap_used` is a clippy `restriction` lint and off by default, so `-D
# warnings` alone never caught this. Tests are exempt via a `cfg_attr` in
# `main.rs` — there, a panic is how a failed assertion reports itself.
[lints.clippy]
unwrap_used = "deny"

[dependencies]
anyhow = "1.0"
# `async fn` in a trait is not dyn-compatible — it returns an anonymous future
# with no known size, so there is no vtable layout for it. Ctx holds every IO
# trait behind `Arc<dyn …>`, and that indirection is what the whole test suite
# is built on, so the returned futures get boxed instead.
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
flate2 = "1.0"
rand = "0.9"
# `rustls-tls-native-roots` reads the OS trust store rather than bundling
# webpki-roots. A developer behind a corporate TLS-inspecting proxy has that
# MITM root installed already; bundled roots reject it, and the symptom is an
# opaque TLS error from every riabuild command on an otherwise working laptop.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls-native-roots",
    "http2",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
# `rt` without `rt-multi-thread`: the runtime is current-thread by construction,
# so a stray `Runtime::new()` cannot quietly spawn a worker pool. Note this
# describes the reactor — `tokio::fs` is std::fs on a blocking pool, because no
# portable async file API exists, so the process still has threads.
tokio = { version = "1", default-features = false, features = [
    "rt",
    "macros",
    "fs",
    "process",
    "net",
    "io-util",
    "time",
] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
