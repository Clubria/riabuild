[workspace]
resolver = "3"
members = ["crates/*"]

# Nothing here is a package. The binary is `crates/cli`, and this file exists to
# hold what must be shared: the release profile, the lint policy, and one
# statement of every third-party dependency.
#
# The workspace root stays at `riabuild-cli/` deliberately. Members share one
# `target/` at the workspace root, so `riabuild-cli/target/<triple>/release/riabuild`
# is still where the binary lands — which is what `.github/workflows/{ci,release}.yml`,
# `e2e/run.sh`, `e2e/remote/*.sh` and `Swatinem/rust-cache` all already point at.
# Moving the root to the repository root would have meant editing every one of them.

[workspace.package]
edition = "2024"
description = "Sets up a Clubria developer's machine and opens the Clubria environment"
homepage = "https://riabuild.clubria.com"
repository = "https://github.com/Clubria/riabuild"
license = "MIT"
# riabuild is distributed through the Homebrew tap, never crates.io.
publish = false

# A panic in a provisioner is the worst failure it has: it prints a Rust
# backtrace on a developer's laptop, says nothing about what riabuild was doing,
# and leaves the machine half-set-up with no advice on whether re-running is
# safe. Every reachable error must instead become a `Failure` (see
# `riabuild-ui`), which carries what was attempted, the command, the detail, one
# next action, and whether a re-run is safe.
#
# `unwrap_used` is a clippy `restriction` lint and off by default, so `-D
# warnings` alone never caught this. It lives here rather than in a member
# because a lint declared in one manifest applies to that crate alone: a member
# that forgets `[lints] workspace = true` loses the policy *silently*, since
# clippy stays green when a lint is simply not enabled. `ci.yml` greps every
# member manifest for the inheritance line for exactly that reason.
#
# The four below are one policy, not four preferences: each is a way of
# spelling "stop here with a Rust backtrace" that the paragraph above rules
# out. A crate root may exempt its **test** target with
# `#![cfg_attr(test, allow(…))]` — in a fixture a panic *is* the reporting
# mechanism — and nothing wider than that. An exemption that also names
# `feature = "testing"` covers the crate's production code too, because
# `--all-targets` resolves dev-dependencies and features unify onto the lib
# target; six crate roots said that and had the whole policy switched off in
# the one command that enforces it.
[workspace.lints.clippy]
unwrap_used = "deny"
# The same panic wearing a message. `expect` reads as the careful spelling and
# is not: both abort a provisioning run half-way through, and the message goes
# to a developer who did not write it and cannot act on it. Where the value
# genuinely cannot be absent, `anyhow::Context` says so and costs a `?`.
expect_used = "deny"
# No production code in this workspace calls `panic!`, so this is a guard rail
# with nothing behind it today, which is the moment to fit one.
panic = "deny"
# Both are `panic!` announcing that the code is unfinished, which is a state a
# shipped provisioner may not be in. Zero occurrences, likewise deliberate.
todo = "deny"
unimplemented = "deny"
#
# Two the register proposed and this does **not** take:
#
# `unreachable` — the five uses in this workspace are all deliberate markers on
# an arm the type system cannot rule out (`Role::Muted` after the branch that
# handles it, `Command::Reset` after the dispatch that returned). Denying it
# would buy five `#[allow]`s, and the way anyone would avoid those is to
# replace a loud invariant with a silent fallback. `panic!` above is the one
# that says "give up"; `unreachable!` says "this arm does not exist", and they
# are not the same claim.
#
# `indexing_slicing` — thirty-three sites, and it is the one on this list whose
# fixes are not mechanical: `&line[..n]` after a length check and `&line[..n]`
# without one look identical here and differ entirely on a developer's laptop.
# It wants its own change, read site by site, not a flag flipped alongside a
# manifest tidy-up.

# Every developer downloads this binary over a laptop connection, so the release
# profile optimises for what ships rather than for build time.
#
# This table only takes effect at the workspace root. Left in a member manifest
# cargo ignores it with a *warning* and builds on, so the first symptom would be
# an unoptimised, unstripped binary in a release.
#
# `strip` is deliberate but not sufficient on its own: on Apple silicon every
# binary must carry a signature, rustc ad-hoc signs one at link time, and
# stripping afterwards can invalidate it — the failure mode is `zsh: killed`
# with no further explanation. The release workflow re-signs after building for
# exactly that reason.
[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

# Feature inheritance is **additive only**: a member may add features to a
# workspace dependency but can never subtract one. So each entry below carries
# the minimum every user needs, and members ask for the rest. Putting the union
# here instead would compile `reqwest`'s JSON stack into the download verifier
# and tokio's process spawner into the terminal code — the comments would
# survive and the decisions would not.
[workspace.dependencies]
anyhow = "1.0"
# Two users, both of them formats somebody else chose. `riabuild-api` reads the
# OpenSSH private key container, which stores a key's public half as a base64
# blob inside a base64 body, so decoding one and encoding the other derives a
# public key without doing any key mathematics. `riabuild-fetch` reads npm's
# `dist.integrity`, a base64 sha512 and the digest pnpm is verified against.
# Hand-rolling forty lines of codec to avoid one zero-dependency crate would be
# forty lines that are wrong in exactly one direction and silently. The hashes
# either one needs are already free through `ring`, below.
base64 = "0.22"
# `async fn` in a trait is not dyn-compatible — it returns an anonymous future
# with no known size, so there is no vtable layout for it. `Ctx` holds every IO
# trait behind `Arc<dyn …>`, and that indirection is what the whole test suite
# is built on, so the returned futures get boxed instead.
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
# Generates the shell completion scripts the packages install. Only the binary
# depends on it, and only the hidden `internal completions` subcommand reaches
# it — the completions are rendered from the same `Cli` struct clap parses with,
# so a new subcommand is completable the moment it exists rather than when
# somebody remembers to update a hand-written script.
clap_complete = "4.5"
flate2 = "1.0"
# `getrandom` rather than `rand`: the two things riabuild randomises are a v4
# account id and reconnect jitter, both of which want raw OS bytes — there is
# no distribution to sample and no seed anything would want to reproduce.
# `rand` reached the same syscall through a ChaCha generator and its SIMD
# backend, and this is the crate underneath it that `rand_core` was depending
# on anyway, so naming it directly costs the tree nothing and drops four.
getrandom = "0.3"
# Four crates need raw syscalls, and each for its own reason: `riabuild-runner`
# opens and sizes a pty, `riabuild-ui` clears `ECHO` for the password prompt,
# `riabuild-gh-session` opens by descriptor with `O_NOFOLLOW | O_DIRECTORY` and
# `fchmod`s the fd so a symlink cannot be swapped in between the check and the
# chmod, and `riabuild-channel` asks for one `getuid`. Those flag values differ
# across Linux and macOS, so they come from `libc` rather than being hand-picked.
libc = "0.2"
# PNG and TIFF decode, PNG encode, for the clipboard channel's MAX_LONG_EDGE
# ceiling. TIFF is not optional: the macOS pasteboard offers `public.tiff`.
# Default features pull in a dozen codecs that never appear on a pasteboard, and
# this binary is downloaded over a laptop connection.
image = { version = "0.25", default-features = false, features = ["png", "tiff"] }
# SHA-256 for the published digests in `riabuild-fetch`. `ring` rather than
# `sha2` because rustls already builds it — the algorithm is compiled into this
# binary either way, and `sha2` would add its own `digest`/`generic-array` tower
# on top to reach the same primitive. If rustls ever moves to another crypto
# provider this stays correct and merely stops being free.
ring = "0.17"
# The terminal UI `riabuild agents` draws, in ratatui's 0.30 modular shape.
#
# `default-features = false` plus `crossterm` asks for exactly one backend. The
# defaults also pull `ratatui-macros`, `palette` and `document-features`, none of
# which this binary uses and all of which land in a download a developer waits
# on. The `crossterm` feature re-exports the backend as `ratatui::crossterm`, so
# nothing here names crossterm a second time and the two can never disagree
# about a version.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
# `riabuild-theme` is the palette and nothing else: it needs `Color`, `Style` and
# `Modifier`, not a widget set and not a backend. `ratatui-core` is the crate
# ratatui 0.30 split those types into for exactly this — colour described without
# a renderer dragged in behind it, which matters because `riabuild-fetch` and
# `riabuild-runner` depend on the palette and never draw a frame.
ratatui-core = "0.1"
# `rustls-tls-native-roots` reads the OS trust store rather than bundling
# webpki-roots. A developer behind a corporate TLS-inspecting proxy has that
# MITM root installed already; bundled roots reject it, and the symptom is an
# opaque TLS error from every riabuild command on an otherwise working laptop.
#
# `json` is *not* here. `riabuild-api` is the only crate that sends or parses a
# JSON body; `riabuild-fetch` only ever calls `.bytes()`.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-native-roots",
    "http2",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# `xattr` is on by default and pulls `rustix` in to restore extended attributes
# from PAX headers on unpack. Nothing riabuild unpacks has any: the Node, `gh`
# and `infisical` tarballs are upstream CI artefacts, and a tar only carries
# xattrs when it was deliberately written with them. Modes and mtimes are core
# tar fields and are unaffected — the executable bit still lands.
tar = { version = "0.4", default-features = false }
# No features at all here, and `default-features = false` on every member that
# names it. The runtime is current-thread by construction, so a stray
# `Runtime::new()` cannot quietly spawn a worker pool — and because features
# unify across the graph rather than per-edge, one member leaving the defaults
# on would hand the whole workspace the multi-threaded runtime this binary
# deliberately does not have.
#
# Note this describes the reactor: `tokio::fs` is `std::fs` on a blocking pool,
# because no portable async file API exists, so the process still has threads.
tokio = { version = "1", default-features = false }
tempfile = "3"
# Mullvad's udp-over-tcp, as a library rather than as the two binaries it also
# builds.
#
# `riabuild remote` opens a mosh session, and mosh is UDP. On a network that
# lets no UDP out — a conference guest network, a corporate egress filter, a
# hotel — that session cannot come up at all, and the only thing riabuild could
# do about it was wait out `mosh-client`'s nineteen seconds of silence and hand
# over a plain `ssh`. This crate is what lets the session ride a TCP stream
# instead: each datagram framed with a 16-bit big-endian length and unpacked
# back into datagrams at the far end. See
# `docs/superpowers/specs/2026-08-25-mosh-over-tcp-design.md`.
#
# **A git dependency, which nothing else in this workspace is.** That is not a
# preference, and the alternative was tried first. `CLAUDE.md`'s rule for a tool
# riabuild installs is to pin a version and verify it against a published
# digest, and where a project publishes none — ngrok, Grok Build — to republish
# the artifact riabuild verified. Neither is available here:
# mullvad/udp-over-tcp has **no releases at all**, ships no binary for any
# platform, and is `publish = false`, so it is not on crates.io either. There is
# nothing to download and nothing to mirror. The only artifact that exists is
# the source.
#
# Given that, compiling it *into* riabuild is the smaller claim than building
# the two binaries in a mirror script and pinning digests against them. Those
# digests would describe riabuild's own build output rather than bytes anyone
# upstream published — precisely what `packaging/grok/mirror.sh` refuses to do —
# and they would need an install task, a version floor, and a second install on
# the far end of every tunnel. As a library it is one `rev` in `Cargo.lock`,
# checked by cargo on every build, compiled into the signed binary that both
# ends of the tunnel already run.
#
# The `rev` is the commit tagged `v0.4.0`, named as a sha rather than as the tag
# because a tag can be moved and a commit cannot. Bumping it is a code change.
#
# What it costs, said out loud: this crate names tokio with
# `features = ["rt-multi-thread", "macros", …]`, features unify across the
# graph, and so the multi-threaded scheduler is compiled in where the comment on
# `tokio` below says it is not. Nothing riabuild writes builds one — `main` is
# `#[tokio::main(flavor = "current_thread")]`, and `ci.yml` greps for the two
# spellings that would change that — but the guarantee is now a checked
# convention rather than an absent feature.
udp-over-tcp = { git = "https://github.com/mullvad/udp-over-tcp", rev = "458100e8abfa51c54c076b523096d694691600b9", default-features = false }
# `deflate-flate2`, not `deflate`. The plain `deflate` alias is two decisions
# in a trench coat: it adds zopfli — an encoder that spends orders of magnitude
# more CPU to save a few percent, for archives riabuild only ever writes in its
# own tests — and it pins flate2 to the zlib-rs backend. `png` and `tiff` ask
# the same flate2 for its default miniz_oxide, features are unified across the
# graph rather than per-edge, so the alias linked *both* deflate backends into
# the binary. Naming the backend-free feature leaves one.
zip = { version = "8.6.0", default-features = false, features = [
    "deflate-flate2",
] }

riabuild-agents = { path = "crates/agents" }
riabuild-api = { path = "crates/api" }
riabuild-channel = { path = "crates/channel" }
riabuild-fetch = { path = "crates/fetch" }
riabuild-gh-session = { path = "crates/gh-session" }
riabuild-harness = { path = "crates/harness" }
riabuild-keychain = { path = "crates/keychain" }
riabuild-paths = { path = "crates/paths" }
riabuild-remote = { path = "crates/remote" }
riabuild-runner = { path = "crates/runner" }
riabuild-tasks = { path = "crates/tasks" }
riabuild-theme = { path = "crates/theme" }
riabuild-ui = { path = "crates/ui" }
riabuild-version = { path = "crates/version" }
