[package]
name = "riabuild-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "riabuild"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
flate2 = "1.0"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
ureq = { version = "2.12", features = ["json"] }

[dev-dependencies]
tempfile = "3"
