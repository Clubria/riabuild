[package]
name = "riabuild-channel"
version = "0.0.0"
edition.workspace = true
description = "The laptop channel: clipboard and browser over the SSH reverse-forward"
homepage.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
# Reconnect jitter.
getrandom.workspace = true
image.workspace = true
# One `getuid`, to refuse a socket that is not ours.
libc.workspace = true
riabuild-gh-session.workspace = true
riabuild-paths.workspace = true
riabuild-runner.workspace = true
riabuild-ui.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = [
    "fs",
    # The pump's transport *is* this process's stdin and stdout: `ssh -T <host>
    # riabuild channel pump` carries every request and reply over them. This is
    # the one place riabuild reads stdio asynchronously rather than handing it
    # to a child, so it is the one crate that needs `io-std`.
    "io-std",
    "io-util",
    "macros",
    "net",
    "rt",
    "sync",
    "time",
] }

[dev-dependencies]
riabuild-runner = { workspace = true, features = ["testing"] }
# For `Ui::warned`. The supervisor's whole job is deciding what to say and when,
# and "it said nothing" — which is the right answer for a channel a sibling
# terminal is already serving — is a claim no test can make without the
# recorders. `riabuild-remote` turns it on for the same reason.
riabuild-ui = { workspace = true, features = ["testing"] }
tempfile.workspace = true
# `test-util` is what lets the supervisor's suite advance a paused clock
# instead of waiting on it: its ping interval is thirty seconds and its
# backoff ceiling thirty more, and a suite that sat through those is a
# suite people stop running. `riabuild-remote` has it for the same reason,
# for the standby interval its holder waits out.
tokio = { workspace = true, features = ["test-util"] }
