[package]
name = "riabuild-harness"
version = "0.0.0"
edition.workspace = true
description = "One event stream from Claude Code, the Codex CLI and Grok Build"
homepage.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
# `Fleet::scripted` and the canned-transcript helpers. Behind a feature rather
# than `#[cfg(test)]` because `riabuild-agents` tests its rendering against these
# same transcripts, and a dependency crate is never compiled with `cfg(test)`.
testing = []

[dependencies]
anyhow.workspace = true
riabuild-runner.workspace = true
serde_json.workspace = true
# `io-util` is `AsyncBufReadExt::read_line` over the child's stdout; `sync` is
# the unbounded channel every session's reader task reports on; `macros` is
# `select!` in the pump. No `process` — spawning belongs to `riabuild-runner`,
# and this crate could not reach it even if it tried.
tokio = { workspace = true, features = ["io-util", "macros", "rt", "sync"] }

[dev-dependencies]
riabuild-runner = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt", "time"] }
