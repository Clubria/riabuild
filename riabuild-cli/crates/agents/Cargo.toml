[package]
name = "riabuild-agents"
version = "0.0.0"
edition.workspace = true
description = "riabuild agents: every harness's sessions in one window, and on disk"
homepage.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
# Session ids. The OS's own bytes, because two windows can create a session in
# the same instant and a counter would have to be read, incremented and written
# under a lock to avoid handing both the same directory.
getrandom.workspace = true
ratatui.workspace = true
# The clipboard Ctrl-V reads. Depended on for the `Clipboard` trait and the MIME
# names, never for a platform: which backend answers is decided in that crate,
# and on a server the tool it runs is riabuild's own shim, so the clipboard this
# window pastes from is the laptop's without anything here knowing it.
riabuild-channel.workspace = true
riabuild-harness.workspace = true
riabuild-paths.workspace = true
riabuild-runner.workspace = true
riabuild-theme.workspace = true
riabuild-ui.workspace = true
serde.workspace = true
serde_json.workspace = true
# `fs` is the session store — records, spools and the directories under them.
# `io-util` is seeking and reading a spool from an offset, which is how a live
# turn is followed. `sync` is the channel the key thread reports on, `macros`
# the `select!` that waits on it, and `time` the redraw tick.
tokio = { workspace = true, features = [
    "fs",
    "io-util",
    "macros",
    "rt",
    "sync",
    "time",
] }

[dev-dependencies]
riabuild-harness = { workspace = true, features = ["testing"] }
riabuild-runner = { workspace = true, features = ["testing"] }
riabuild-theme = { workspace = true, features = ["testing"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
