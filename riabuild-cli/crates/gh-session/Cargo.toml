[package]
name = "riabuild-gh-session"
version = "0.0.0"
edition.workspace = true
description = "Where the GitHub configuration directory goes, and how it is created safely"
homepage.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
# O_NOFOLLOW | O_DIRECTORY and fchmod, so a co-tenant cannot swap a
# symlink in between the check and the chmod.
libc.workspace = true
riabuild-paths.workspace = true
riabuild-runner.workspace = true
riabuild-ui.workspace = true
tokio = { workspace = true, features = ["fs", "rt"] }

[dev-dependencies]
riabuild-runner = { workspace = true, features = ["testing"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros"] }
