[package]
name = "riabuild-remote"
version = "0.0.0"
edition.workspace = true
description = "Remote mode: setting up a server from a laptop and opening a shell on it"
homepage.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
getrandom.workspace = true
riabuild-api.workspace = true
riabuild-channel.workspace = true
riabuild-fetch.workspace = true
riabuild-keychain.workspace = true
riabuild-paths.workspace = true
riabuild-runner.workspace = true
riabuild-tasks.workspace = true
riabuild-theme.workspace = true
riabuild-ui.workspace = true
riabuild-version.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "net", "rt", "time"] }
udp-over-tcp.workspace = true

[dev-dependencies]
flate2.workspace = true
riabuild-keychain = { workspace = true, features = ["testing"] }
riabuild-paths = { workspace = true, features = ["testing"] }
riabuild-runner = { workspace = true, features = ["testing"] }
riabuild-tasks = { workspace = true, features = ["testing"] }
riabuild-theme = { workspace = true, features = ["testing"] }
riabuild-ui = { workspace = true, features = ["testing"] }
tar.workspace = true
tempfile.workspace = true
# `test-util` for the same reason `riabuild-channel` has it: the channel's
# holder waits five seconds between asks for the lease, and the test that pins
# a standing-by session taking the channel over would otherwise sit through
# that interval for real.
tokio = { workspace = true, features = ["macros", "test-util"] }
