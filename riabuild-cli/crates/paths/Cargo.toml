[package]
name = "riabuild-paths"
version = "0.0.0"
edition.workspace = true
description = "Where riabuild keeps its things, the state it persists, and the locks around it"
homepage.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true
[features]
# `RealPaths::rooted_at`, which points the whole tree at a tempdir. Reached
# from roughly ninety tests across `riabuild-remote`, `riabuild-tasks` and the
# binary.
testing = []

[dependencies]
anyhow.workspace = true
# ENOTSUP/EOPNOTSUPP/ENOSYS, to tell a filesystem that cannot lock from a
# lock that was refused — `filelock` treats the former as success.
libc.workspace = true
riabuild-ui.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "rt"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "time"] }
