[package]
name = "riabuild-api"
version = "0.0.0"
edition.workspace = true
description = "The riabuild-web client: sessions, org configuration, and brokered secrets"
homepage.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
# `openssh.rs` — decoding the key container and encoding the public blob back.
base64.workspace = true
# SHA-256, for an issued key's fingerprint. Free: rustls builds `ring` anyway.
ring.workspace = true
# The only crate that sends or parses a JSON body, and so the only one
# that pays for reqwest's JSON stack.
reqwest = { workspace = true, features = ["json"] }
riabuild-runner.workspace = true
riabuild-ui.workspace = true
serde.workspace = true
serde_json.workspace = true
# The device-code poll interval.
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
# `FakeRunner`, for the two branches of `auth::open_browser`. A dev-dependency
# and nothing else: the fake must never be reachable from a shipped binary, and
# `cargo build` does not resolve this table.
riabuild-runner = { workspace = true, features = ["testing"] }
# `net` and `io-util` are for `loopback.rs` alone: it stands a one-shot HTTP
# server on an ephemeral loopback port and speaks the protocol by hand, which is
# how this client is tested against real URLs, real headers and real statuses
# without a mocking crate in the tree. `riabuild-fetch`'s download tests do the
# same thing for the same reason.
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt"] }
