name: Set up pnpm and Node
description: Installs the pnpm and Node versions riabuild-web is built and tested with.

# The same three answers were written out in five jobs across three workflows,
# and the version riabuild-web builds with is not a per-job decision. It takes no
# inputs for that reason: a job that wanted a different Node would be a fact
# about riabuild-web, and belongs in riabuild-web, not in a `with:` block.
#
# Order matters. `actions/setup-node` reads `cache: pnpm` by shelling out to
# pnpm for its store path, so pnpm has to be on PATH before it runs.
#
# `cache-dependency-path` is resolved against the repository root rather than a
# job's `defaults.run.working-directory`, which is why it still names
# `riabuild-web/` from in here.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: 10

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: riabuild-web/pnpm-lock.yaml
