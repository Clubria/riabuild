name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Both triggers above are webhook-delivered. On 2026-08-06 an Actions incident
  # throttled webhooks for hours: pushes produced no runs at all and there was
  # no way to ask for one, because `gh workflow run` needs this trigger to
  # exist. It goes through the REST API instead, which stayed up throughout.
  workflow_dispatch:

# Read-only, and stated rather than inherited. Without a block a workflow gets
# the repository's default GITHUB_TOKEN scope, which on many repositories is
# read *and write* — and this is the workflow that builds and runs code from a
# pull request: `cargo test` compiles every `build.rs` in the dependency tree,
# `pnpm build` runs whatever the lockfile resolved, and `docker run` executes an
# image. None of that should be able to write to this repository.
#
# `changes` grants itself one thing more; see the job.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which subprojects this push or pull request actually touched.
  #
  # Eighteen of the last thirty commits never went near `riabuild-web`, and
  # every one of them still paid the five-and-a-half minutes the Playwright job
  # takes — which is the whole critical path, since nothing else here runs past
  # about three. A Rust-only change now waits for the Rust jobs and nothing
  # else.
  #
  # Filtering happens per *job* rather than through `on.pull_request.paths`,
  # which is workflow-wide and would take the whole suite away at once. A job
  # skipped by `if:` still reports a conclusion, so it stays visible on the pull
  # request as "skipped" instead of silently never appearing.
  #
  # Every filter lists this file. A change to CI itself has to be able to run
  # the jobs it changes, and a filter that excluded its own workflow would be
  # untestable except by merging it.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    # dorny/paths-filter asks the API which files a pull request touched, which
    # the read-only default token cannot do on its own.
    permissions:
      contents: read
      pull-requests: read
    # `workflow_dispatch` forces everything. It exists here because an Actions
    # incident once throttled webhooks for hours (see the trigger above), and
    # someone reaching for the manual button during one wants the whole suite —
    # not a subset chosen by a diff they are already unsure reached GitHub.
    outputs:
      cli: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.cli == 'true' }}
      remote: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.remote == 'true' }}
      web: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.web == 'true' }}
      packaging: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.packaging == 'true' }}
    steps:
      # The whole history, which for this repository is 89 commits and 1.2 MiB.
      # On a pull request the filter asks the API which files changed and needs
      # no history at all, but on a push to main it has to diff against
      # `github.event.before` — a commit a depth-1 clone does not have. The
      # action deepens the clone itself to find it, and that is the path that
      # breaks: not here, but on main, after the merge, where a filter that
      # cannot see the diff decides nothing changed.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            # `.github/actions/**` is listed beside this workflow for the same
            # reason `Formula/**` is listed below: the toolchain setup these
            # jobs run now lives there, so a change to it that this filter
            # cannot see is a change no job would build against.
            cli:
              - 'riabuild-cli/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            remote:
              - 'riabuild-cli/**'
              - 'e2e/remote/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            web:
              - 'riabuild-web/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            packaging:
              - 'packaging/**'
              # The rendered formula, which nothing but release.yml is supposed
              # to write. It was not listed, so editing the one file CLAUDE.md
              # forbids editing triggered no job at all — and the hand edit
              # would survive until the next release silently overwrote it.
              - 'Formula/**'
              - 'LICENSE'
              - '.github/workflows/ci.yml'

  cli:
    name: riabuild-cli
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: riabuild-cli
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy

      # `--locked` everywhere below, and deliberately not here. Without it cargo
      # is free to resolve a newer dependency than Cargo.lock pins, so CI can
      # pass against a graph the release — which does pass `--locked` — never
      # builds. `cargo fmt` is the one exception: it rejects the flag outright
      # ("unexpected argument '--locked' found") because it never resolves a
      # dependency graph to begin with.
      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets --locked

      # `--all-targets` selects *targets*, not packages, and lint configuration
      # is per-package: a member that forgets to inherit simply has the lint
      # switched off, and clippy stays green. `unwrap_used` is the whole panic
      # policy, so the absence has to be an error rather than a quiet default.
      - name: Every crate inherits the workspace lints
        run: |
          set -euo pipefail
          missing=0
          for manifest in crates/*/Cargo.toml; do
            if ! grep -q '^workspace = true' "$manifest"; then
              echo "::error file=riabuild-cli/$manifest::missing [lints] workspace = true"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || {
            echo "::error::A crate without it silently loses unwrap_used = \"deny\"."
            exit 1
          }
          echo "all $(ls -d crates/*/ | wc -l) crates inherit [workspace.lints]."

      # `riabuild-tasks`'s `testing` feature hands the fake `Ctx` across a crate
      # boundary, which `#[cfg(test)]` cannot. It must reach other crates
      # through [dev-dependencies] only — `cargo build` never resolves those —
      # so this holds by construction until someone puts features = ["testing"]
      # on a normal dependency edge, and nothing anywhere would say so.
      #
      # `-e normal,build` deliberately, against cargo tree's default of
      # `normal,build,dev`: the dev graph is what `cargo test` builds and is
      # exactly where the feature is meant to be on. Resolving compiles nothing.
      #
      # The second half is not belt-and-braces: an absence check goes green the
      # moment the feature is renamed, so it has to prove there is still
      # something to be absent.
      - name: The testing feature cannot reach a release build
        run: |
          set -euo pipefail
          if cargo tree --locked -p riabuild-cli -e normal,build,features \
              | grep -n 'feature "testing"'; then
            echo "::error::'testing' is enabled in the graph cargo build resolves."
            echo "::error::It must arrive only through [dev-dependencies]."
            exit 1
          fi
          if ! cargo tree --locked -p riabuild-cli -e normal,build,dev,features \
              | grep -q 'feature "testing"'; then
            echo "::error::Nothing enables 'testing' even with dev-dependencies."
            echo "::error::It was renamed or dropped, so the check above proves nothing."
            exit 1
          fi
          echo "testing is reachable only through dev-dependencies."

      # [profile.release] only takes effect at the workspace root. Left in a
      # member manifest cargo ignores it with a *warning* and builds on, so the
      # first symptom would be an unoptimised, unstripped binary in a release.
      # Stripping is not cosmetic: release.yml re-signs after it because
      # stripping invalidates an Apple ad-hoc signature, and an arm64 binary
      # with a broken signature is killed on launch saying only "killed: 9".
      - name: The release profile still applies
        run: |
          set -euo pipefail
          log=$(mktemp)
          cargo build --release --locked 2>&1 | tee "$log"

          if grep -q 'profiles for the non root package will be ignored' "$log"; then
            echo "::error::A [profile.*] table sits in a member manifest; cargo ignored it."
            echo "::error::Profiles belong in riabuild-cli/Cargo.toml, the workspace root."
            exit 1
          fi

          bin=target/release/riabuild
          test -x "$bin"
          file "$bin"
          if file "$bin" | grep -q 'not stripped'; then
            echo "::error::$bin still carries a symbol table; strip = \"symbols\" did not apply."
            exit 1
          fi

          # Deliberately loose. Losing the profile is a 3-5x step change, not a
          # few percent, so a generous ceiling catches it without ever failing
          # on ordinary growth.
          bytes=$(wc -c < "$bin")
          limit=$((30 * 1024 * 1024))
          echo "release binary: $bytes bytes (ceiling $limit)"
          if [ "$bytes" -gt "$limit" ]; then
            echo "::error::$bin is $bytes bytes, past the $limit-byte ceiling."
            echo "::error::Either [profile.release] stopped applying, or it grew a lot."
            exit 1
          fi

  # The same unit tests, on the other platform riabuild ships to.
  #
  # `riabuild-cli` above is the whole gate for everything that is not a platform
  # branch, and this job deliberately does not repeat its fmt, clippy or
  # packaging checks — those answer the same on both hosts and paying for a
  # macOS runner to hear it twice buys nothing.
  #
  # What it buys is the thing this repository has now been bitten by twice.
  # `cargo test` on macOS used to run only in `release.yml`, which triggers on
  # `v*` — *after* the tag is pushed. So a test that only fails on a Mac could
  # not fail on a pull request: it failed on the release, with the tag already
  # public and no binaries behind it. The keychain wrappers went that way (see
  # "The parameter has to reach the public function" in `riabuild-cli/CLAUDE.md`),
  # and `pump::tests` went the same way by *hanging* rather than failing, which
  # is worse — it published nothing and reported nothing for as long as GitHub
  # would let the job run.
  #
  # `e2e.yml`'s "riabuild on macOS" job is not this. It runs the end-to-end
  # suite on `pull_request`; a green tick there has never meant a single unit
  # test ran on a Mac.
  cli-macos:
    name: riabuild-cli on macOS
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: macos-latest
    # A hung test must be a red job, not a six-hour one. The Linux job runs the
    # same suite in about two minutes, so this is roughly ten times the headroom
    # a slower runner needs and still fails inside a coffee break.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: riabuild-cli
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/setup-rust

      # `--test-threads` is left alone, but the timeout above is a blunt
      # instrument: it names the job, not the test. libtest's own warning is
      # what names the test, and it only reaches the log if the output is not
      # still sitting in a buffer when the job is killed — hence `--nocapture`.
      - name: Test
        run: cargo test --workspace --all-targets --locked -- --nocapture

  web:
    name: riabuild-web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: riabuild-web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/setup-pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint and typecheck
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Fixtures describe an org that does not exist and a dev sign-in that must
      # never ship. They are supposed to fall out with the dead
      # `import.meta.env.DEV` branch — this proves they did.
      - name: No fixtures in the production bundle
        run: |
          set -euo pipefail
          if grep -rlE 'Wolfeschlegelsteinhausenbergerdorff|Fixture scenario|clubria\.test' dist/assets/; then
            echo "::error::Dev fixtures leaked into the production bundle"
            exit 1
          fi
          echo "No fixture data in dist/."

      # Vite inlines `import.meta.env.VITE_CONVEX_URL` at build time, so a build
      # without it makes the guard in main.tsx statically true and Rollup drops
      # the whole Convex client as dead code. That is the right behaviour — the
      # app renders "no backend" instead of a blank page — but it means a deploy
      # that forgets the variable ships a bundle that can never connect and
      # looks perfectly healthy. This proves the configured path still bundles
      # a real client.
      - name: A configured build still contains the Convex client
        run: |
          set -euo pipefail
          VITE_CONVEX_URL="https://ci-placeholder.convex.cloud" pnpm build
          if ! grep -rq 'convex\.cloud' dist/assets/; then
            echo "::error::Convex client missing from a build that had VITE_CONVEX_URL set"
            exit 1
          fi
          echo "Configured build bundles the Convex client."

  ui:
    name: riabuild-web UI
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: riabuild-web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/setup-pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Half a minute of every run was re-downloading a Chromium that had not
      # changed. Keyed on the lockfile rather than on a Playwright version
      # string: the browser revision is chosen by the installed
      # `@playwright/test`, so the lockfile moving is the conservative moment to
      # fetch again. That costs an occasional needless miss and can never serve
      # a browser build the installed Playwright would refuse.
      - name: Cache Chromium
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('riabuild-web/pnpm-lock.yaml') }}

      # Deliberately *not* skipped on a cache hit, though that is the usual
      # recipe. `actions/cache` saves in a post step that runs even when the job
      # failed, so an install interrupted halfway — a network blip mid-download
      # — still writes a partial browser directory under this key. Gated on the
      # hit, every later run would then restore that partial directory, skip the
      # install, and fail at `browserType.launch` with an executable that is not
      # there: a poisoned cache that repairs itself only when the lockfile
      # happens to move.
      #
      # `playwright install` is idempotent and checks the revision itself, so
      # running it unconditionally skips the download on a good cache and
      # repairs a bad one. What is left is the apt half of `--with-deps`, which
      # is a dozen seconds and cannot be cached anyway: those libraries live
      # outside this path, and a browser restored without them fails at launch
      # rather than here, where the reason would be obvious.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # The one case that needs there to be no backend, run while there is
      # none.
      #
      # `main.tsx` picks the offline data source when `VITE_CONVEX_URL` is
      # unset, and Vite reads that out of `.env.local` — so the moment the next
      # step writes one, this test navigates to a 404 served by a *live*
      # client. It keeps passing, having stopped asserting anything about the
      # screen it is named after, which is the failure mode the whole
      # `RIABUILD_E2E_BACKEND` flag below exists to avoid elsewhere. Two
      # invocations is what keeps it a test that can fail: this one before the
      # deployment exists, and the suite below with it grepped out.
      - name: The offline 404, before there is a deployment
        run: pnpm ui:check --grep "404 renders with no backend at all"
        timeout-minutes: 10

      # A deployment for `smoke.spec.ts`, which signs in for real and is the
      # one suite that can catch a field renamed on the Convex side — fixtures
      # implement the `Data` contract and cannot. It skips itself when nothing
      # answers, so until this step existed it ran here and asserted nothing.
      #
      # Anonymous mode is what makes that need no Convex account and no deploy
      # key: the CLI downloads `convex-local-backend` and runs it against local
      # state, the way `e2e/run.sh` does. CI therefore cannot reach, or damage,
      # the production deployment.
      #
      # `convex dev` keeps running in the background for the rest of the job;
      # the runner takes it down with everything else.
      - name: Start a Convex deployment
        timeout-minutes: 10
        run: |
          rm -f .env.local
          CONVEX_AGENT_MODE=anonymous npx convex dev --tail-logs disable --typecheck disable &
          for _ in $(seq 1 120); do [ -f .env.local ] && grep -q VITE_CONVEX_URL .env.local && break; sleep 1; done
          grep -q VITE_CONVEX_URL .env.local
          for kv in "RIABUILD_DEV_AUTH 1" "RIABUILD_DEV_SEED 1" "RIABUILD_BOOTSTRAP_LEADS devlead"; do
            CONVEX_AGENT_MODE=anonymous npx convex env set $kv
          done

      # The keys `@convex-dev/auth` signs a session with. Without them the dev
      # sign-in button is there, the click reaches the backend, and the action
      # throws on a missing `JWT_PRIVATE_KEY` — a smoke failure that says
      # nothing about the change under test.
      #
      # Set here rather than by running `npx @convex-dev/auth`, which is what
      # `pnpm predev` does on a laptop: that command also wants to rewrite
      # `convex/auth.ts` and `convex/http.ts` to its own templates, and ours
      # match neither, so it stops on an interactive "Ready to continue?" that
      # no CI runner can answer. What it does to the keys themselves is these
      # four lines — an RS256 pair, the private half as PKCS#8 with its
      # newlines flattened to spaces, the public half as a one-key JWKS.
      #
      # `SITE_URL` is only read on the OAuth redirect path, which the anonymous
      # provider never takes. It is set anyway: the three arrive together, and
      # a deployment missing one of them is a puzzle to debug from a test
      # failure.
      - name: Give the deployment its auth signing keys
        timeout-minutes: 5
        run: |
          node --input-type=module -e '
            import { generateKeyPairSync } from "node:crypto";
            import { writeFileSync } from "node:fs";
            const { privateKey, publicKey } = generateKeyPairSync("rsa", {
              modulusLength: 2048,
            });
            const pem = privateKey.export({ type: "pkcs8", format: "pem" });
            writeFileSync(process.env.RUNNER_TEMP + "/jwt.pem", pem.trimEnd().replace(/\n/g, " "));
            const jwk = publicKey.export({ format: "jwk" });
            writeFileSync(
              process.env.RUNNER_TEMP + "/jwks.json",
              JSON.stringify({ keys: [{ use: "sig", ...jwk }] }),
            );
          '
          CONVEX_AGENT_MODE=anonymous npx convex env set -- JWT_PRIVATE_KEY "$(cat "$RUNNER_TEMP/jwt.pem")"
          CONVEX_AGENT_MODE=anonymous npx convex env set -- JWKS "$(cat "$RUNNER_TEMP/jwks.json")"
          CONVEX_AGENT_MODE=anonymous npx convex env set -- SITE_URL http://127.0.0.1:5199
          rm -f "$RUNNER_TEMP/jwt.pem" "$RUNNER_TEMP/jwks.json"
          # A 401 from our own route proves the backend is listening *and* that
          # convex/http.ts is deployed. Waiting on the URL alone races the
          # function push and fails later, further from the cause.
          #
          # The version header is not decoration. `guard` runs the version
          # floor *before* authentication, and an absent
          # `x-riabuild-cli-version` counts as version `0` rather than as an
          # exemption — so a bare curl against a deployment with no `orgConfig`
          # row is answered 409 `cli_too_old` against the default floor of
          # 0.1.0, and never 401. Sending a version that clears any floor is
          # what keeps this poll an assertion about the *auth* path, which is
          # the one smoke.spec.ts is about to walk.
          SITE="$(sed -n 's/^VITE_CONVEX_SITE_URL=//p' .env.local | tr -d '\r')"
          probe() {
            curl -s -o /dev/null -w '%{http_code}' \
              -H 'x-riabuild-cli-version: 9999.0.0' "$SITE/api/v1/me"
          }
          for _ in $(seq 1 120); do
            [ "$(probe)" = "401" ] && break
            sleep 1
          done
          [ "$(probe)" = "401" ]

      # Structural assertions only — horizontal overflow, clipping, focus
      # visibility, axe, console errors. Deliberately no committed pixel
      # baselines: font rasterisation differs between a laptop and this
      # container, so a pixel gate would fail forever for reasons unrelated to
      # any change. Judging pixels is the human-in-the-loop step documented in
      # .claude/skills/visual-testing/SKILL.md.
      #
      # `RIABUILD_E2E_BACKEND=1` because this job went to the trouble of
      # standing a deployment up: if it is not answering, the smoke suite has
      # to say so rather than skip itself and report green for tests that never
      # ran.
      - name: Visual suite
        run: pnpm ui:check --grep-invert "404 renders with no backend at all"
        timeout-minutes: 20
        env:
          RIABUILD_E2E_BACKEND: "1"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-screenshots
          path: riabuild-web/e2e/__screens__/
          if-no-files-found: warn

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-traces
          path: riabuild-web/e2e/__results__/
          if-no-files-found: ignore

  remote-mode:
    name: Remote mode against a container
    needs: changes
    if: needs.changes.outputs.remote == 'true'
    runs-on: ubuntu-latest
    # Skipped, visibly, rather than run without what it needs. Before it
    # touches a server `riabuild remote` re-verifies Clubria org membership
    # against real GitHub, and the built-in `github.token` is repo-scoped —
    # it cannot answer `/user/memberships/orgs/*`. That needs a user token
    # from a bot account in the org, stored as RIABUILD_E2E_GH_TOKEN.
    #
    # The secret is lifted to job-level `env` because the `secrets` context is
    # not available in an `if:` — only `env` is, and only from job level. The
    # steps below then gate on it, and say so when it is absent: a green tick
    # from a run that never reached the container would be worse than no run.
    env:
      RIABUILD_E2E_GH_TOKEN: ${{ secrets.RIABUILD_E2E_GH_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/setup-rust

      # Three packages, and each earns its place. `xvfb` and `xclip` give
      # `channel.sh`'s laptop side a real clipboard to serve rather than a
      # scripted stand-in (that script's header explains the trade);
      # `musl-tools` is for the *server* binary both scripts now copy into
      # their container, because the container's glibc is older than this
      # runner's and musl is what release.yml ships for Linux anyway.
      - name: Install what the container tests drive
        run: sudo apt-get update && sudo apt-get install -y xvfb xclip musl-tools

      - run: cargo build --release --locked
        working-directory: riabuild-cli

      # Built BEFORE `run.sh` rather than after it, which is the change that
      # gave this job something to gate.
      #
      # `run.sh`'s act one installs a real published release on the container —
      # that is the only thing `install::ensure_riabuild` can do, and it is
      # real coverage of the download-and-verify path. But it also means the
      # binary that runs the task DAG is the *last release*, so a server-side
      # regression this pull request introduces could not turn this job red and
      # a server-side bug it fixes could not turn it green. Act two copies this
      # musl build onto the same container and drives the server side with it,
      # and that is the half that gates the change. `channel.sh` takes the same
      # binary afterwards, so nothing is built twice.
      #
      # `ring` builds C, and cc-rs looks for a compiler named after the target;
      # Ubuntu's musl-tools ships `musl-gcc` under that one name. release.yml
      # sets the same two variables for the same reason.
      - name: Build the server's riabuild
        working-directory: riabuild-cli
        run: |
          rustup target add x86_64-unknown-linux-musl
          CC_x86_64_unknown_linux_musl=musl-gcc \
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc \
            cargo build --release --locked --target x86_64-unknown-linux-musl

      # `run.sh` distinguishes a real regression (SSH, identity, host-key
      # trust, authorising the key, installing and verifying the release,
      # riabuild-web) from the one known, tracked gap: the stand-in
      # riabuild-web does not implement every route a full server-side
      # provisioning run needs. That gap exits 0 with a banner naming the
      # routes the run actually asked for and did not get — but only after
      # asserting, against the container, that the earlier stages really ran.
      # Anything else, including a hang, fails this step for real, and so does
      # act two: that half runs the binary built above and is judged outright.
      - run: bash e2e/remote/run.sh
        if: env.RIABUILD_E2E_GH_TOKEN != ''
        timeout-minutes: 25
        env:
          RIABUILD_BIN: ${{ github.workspace }}/riabuild-cli/target/release/riabuild
          RIABUILD_SERVER_BIN: ${{ github.workspace }}/riabuild-cli/target/x86_64-unknown-linux-musl/release/riabuild

      - name: Report that the container test was skipped
        if: env.RIABUILD_E2E_GH_TOKEN == ''
        run: |
          echo "::warning title=Remote mode e2e skipped::\
          RIABUILD_E2E_GH_TOKEN is not set, so the container test did not run. \
          It needs a user token from an active Clubria org member; the built-in \
          GITHUB_TOKEN cannot read /user/memberships/orgs/*."

      # `channel.sh` needs no GitHub token: it never runs `riabuild remote`, so
      # nothing re-verifies org membership. It is therefore ungated — this job
      # does real work on a fork's pull request instead of only warning.
      - run: bash e2e/remote/channel.sh
        timeout-minutes: 20
        env:
          RIABUILD_BIN: ${{ github.workspace }}/riabuild-cli/target/release/riabuild
          RIABUILD_SERVER_BIN: ${{ github.workspace }}/riabuild-cli/target/x86_64-unknown-linux-musl/release/riabuild

  # The release workflow renders these templates only after the GitHub release
  # is already published, so one that does not parse would leave a released
  # version with a stale tap or an empty apt repository. Checking them on every
  # pull request is what keeps that from being discovered at release time.
  packaging:
    name: Packaging templates
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Render and validate the formula
        run: |
          set -euo pipefail
          sed \
            -e "s|@VERSION@|0.0.0|g" \
            -e "s|@SHA256_AARCH64@|$(printf 'a%.0s' {1..64})|g" \
            -e "s|@SHA256_X86_64@|$(printf 'b%.0s' {1..64})|g" \
            packaging/homebrew/riabuild.rb > rendered.rb

          if grep -q '@[A-Z0-9_]*@' rendered.rb; then
            echo "::error::Template has a placeholder the release workflow does not substitute:"
            grep -n '@[A-Z0-9_]*@' rendered.rb
            exit 1
          fi

          ruby -c rendered.rb

          # The formula's download URLs must match the names the release
          # workflow actually produces, or `brew install` 404s on a release
          # that otherwise looks healthy.
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            expected="riabuild-0.0.0-$target.tar.gz"
            if ! grep -q "/$expected\"" rendered.rb; then
              echo "::error::Formula does not point at $expected"
              exit 1
            fi
          done
          echo "Formula renders, parses, and points at the artifacts the release builds."

      # The check above proves the *template* is sound. This one proves nobody
      # edited its output.
      #
      # `Formula/riabuild.rb` is written by release.yml and says so in its own
      # header — "Edit this file, never Formula/riabuild.rb". Nothing enforced
      # it: a hand edit sat on main looking authoritative until the next release
      # overwrote it, and in between it was what every `brew install` read.
      #
      # The version and the two digests are taken *from the committed file* and
      # substituted back in, so this asserts only that the rest of the formula
      # is the template's output. A real release changing those three values is
      # not a failure; anything else changing is.
      - name: The committed formula is the template's output
        run: |
          set -euo pipefail
          committed=Formula/riabuild.rb
          if [ ! -f "$committed" ]; then
            echo "No $committed yet — the first release creates it."
            exit 0
          fi

          version=$(sed -n 's/^  version "\(.*\)"$/\1/p' "$committed")
          aarch64=$(sed -n '/on_arm do/,/end/s/^    sha256 "\(.*\)"$/\1/p' "$committed")
          x86_64=$(sed -n '/on_intel do/,/end/s/^    sha256 "\(.*\)"$/\1/p' "$committed")

          for name in version aarch64 x86_64; do
            if [ -z "${!name}" ]; then
              echo "::error::Could not read $name out of $committed."
              echo "::error::Either the formula was hand-edited into a shape this cannot"
              echo "::error::read, or packaging/homebrew/riabuild.rb changed shape and this"
              echo "::error::check needs updating with it."
              exit 1
            fi
          done

          sed \
            -e "s|@VERSION@|$version|g" \
            -e "s|@SHA256_AARCH64@|$aarch64|g" \
            -e "s|@SHA256_X86_64@|$x86_64|g" \
            packaging/homebrew/riabuild.rb > expected.rb

          if ! diff -u expected.rb "$committed"; then
            echo "::error::$committed is not what packaging/homebrew/riabuild.rb renders."
            echo "::error::It is generated: edit the template, and the next release"
            echo "::error::regenerates the formula. A hand edit here is overwritten."
            exit 1
          fi
          echo "$committed matches the template at $version."

      - name: Install the Linux packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      # Built around a stub binary rather than a real one. What is under test
      # here is the templates — whether the rendered control file and spec
      # produce packages a real dpkg and a real rpm accept and install to the
      # right path — and a two-line shell script exercises all of that without a
      # musl toolchain and a five-minute build in front of it.
      #
      # The rendering and the assertions are packaging/build-packages.sh and
      # packaging/verify-packages.sh, which release.yml also calls. They used to
      # be a hundred lines written out in both files, and the copies had drifted:
      # only release.yml checked the deb's Architecture field and its copyright
      # file, only this one checked that the rpm still declares `Requires: git`,
      # and each miss was invisible from the file it was missing in.
      #
      # Only the runner's own architecture gets an rpm. `rpmbuild --target
      # aarch64` on an x86_64 host fails with "No compatible architectures found
      # for build", and so does `rpmspec -P`, so the aarch64 spec cannot even be
      # parsed here. dpkg-deb does not care what it is packaging, so both deb
      # architectures are built — which is what catches a wrong Architecture
      # field.
      - name: Render the Linux templates and build real packages
        run: |
          set -euo pipefail
          version=2026.08.06
          mkdir -p build

          printf '#!/bin/sh\necho "riabuild %s"\n' "$version" > build/riabuild
          chmod 0755 build/riabuild

          packaging/build-packages.sh --version "$version" \
            --binary build/riabuild --deb-arch amd64
          packaging/build-packages.sh --version "$version" \
            --binary build/riabuild --deb-arch arm64 --rpm-arch x86_64

      # The aarch64 spec cannot be built here, but it can be rendered and
      # checked for the mistake that actually happens: a placeholder the release
      # workflow does not substitute. build-packages.sh rejects one outright, so
      # this only has to prove the architecture reached the spec.
      - name: The aarch64 spec renders
        run: |
          set -euo pipefail
          sed -e "s|@VERSION@|2026.08.06|g" -e "s|@RPM_ARCH@|aarch64|g" \
            packaging/rpm/riabuild.spec.in > build/riabuild-aarch64.spec
          grep -qx 'BuildArch:      aarch64' build/riabuild-aarch64.spec
          if grep -q '@[A-Z0-9_]*@' build/riabuild-aarch64.spec; then
            echo "::error::The aarch64 spec has a placeholder the release does not substitute:"
            grep -n '@[A-Z0-9_]*@' build/riabuild-aarch64.spec
            exit 1
          fi

      # The rendered templates producing a *file* is not the same as a package
      # manager accepting it. A bad Depends line, a malformed description, or a
      # spec that installs somewhere unexpected all pass every check above, so
      # --containers puts both through a real apt and a real dnf.
      #
      # Only the amd64 deb and the x86_64 rpm can be installed on this runner;
      # the arm64 deb gets its metadata checked and nothing more. release.yml
      # runs the container half natively on both architectures.
      - name: Verify the packages, and install them
        run: |
          set -euo pipefail
          version=2026.08.06
          packaging/verify-packages.sh --version "$version" \
            --deb "dist/riabuild_${version}_amd64.deb" --deb-arch amd64 \
            --rpm "dist/riabuild-$version-1.x86_64.rpm" --rpm-arch x86_64 \
            --containers
          packaging/verify-packages.sh --version "$version" \
            --deb "dist/riabuild_${version}_arm64.deb" --deb-arch arm64

      # riabuild's versions are zero-padded release dates, which exercise the
      # parts of dpkg's and rpm's comparison that differ from semver. Getting
      # this wrong means `apt upgrade` silently declines to move a developer
      # forward, which looks like nothing happening at all.
      - name: Both packagers order release dates the way version.rs does
        run: |
          set -euo pipefail

          dpkg --compare-versions 2026.08.06 lt 2026.08.12
          dpkg --compare-versions 2026.08.06 lt 2026.08.06.1
          dpkg --compare-versions 2026.08.06 eq 2026.8.6
          dpkg --compare-versions 2026.12.01 gt 2026.02.01

          # rpm's own comparison, through the rpm binary rather than the
          # rpmdevtools wrapper: one package fewer, and it answers 1/-1/0
          # instead of exit codes 11/12/0.
          check_rpm() {
            actual=$(rpm --eval "%{lua:print(rpm.vercmp('$1','$2'))}")
            if [ "$actual" != "$3" ]; then
              echo "::error::rpm ordered $1 against $2 as $actual, expected $3"
              exit 1
            fi
          }
          check_rpm 2026.08.12 2026.08.06 1
          check_rpm 2026.08.06 2026.08.06.1 -1
          check_rpm 2026.08.06 2026.08.06 0
          check_rpm 2026.08.06 2026.8.6 0
          check_rpm 2026.12.01 2026.02.01 1

          echo "dpkg and rpm agree with version.rs on riabuild's dates."

      # Rendered by the pages job *after* the GitHub release is public, which is
      # the worst moment to find out one of them is wrong: a broken @VERSION@ or
      # a wrong baseurl is then live on the site developers are being sent to,
      # and the only fix is another release. The homebrew, debian and rpm
      # templates were checked here and these two were not.
      - name: The published page and the dnf repo file render
        run: |
          set -euo pipefail
          sed -e "s|@VERSION@|2026.08.06|g" packaging/pages/index.html.in > index.html
          if grep -q '@[A-Z0-9_]*@' index.html; then
            echo "::error::index.html still contains unsubstituted placeholders:"
            grep -n '@[A-Z0-9_]*@' index.html
            exit 1
          fi
          grep -q '2026.08.06' index.html

          # Well-formedness, through the parser rather than by eye. An unclosed
          # tag renders as something, and "something" on the page that tells
          # people how to install riabuild is not good enough.
          #
          # Stricter than HTML requires: a browser closes <p> and <li> for you,
          # this does not. The page is one hand-written file that closes every
          # tag today, and demanding it keeps doing so costs nothing and is the
          # only version of this check that can be written in twenty lines.
          python3 - <<'PY'
          import html.parser
          import sys


          class Strict(html.parser.HTMLParser):
              VOID = {"area", "base", "br", "col", "embed", "hr", "img", "input",
                      "link", "meta", "source", "track", "wbr"}

              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.stack = []

              def handle_starttag(self, tag, attrs):
                  if tag not in self.VOID:
                      self.stack.append(tag)

              def handle_startendtag(self, tag, attrs):
                  pass

              def handle_endtag(self, tag):
                  if tag in self.VOID:
                      return
                  if not self.stack:
                      sys.exit(f"::error::stray </{tag}> in index.html")
                  open_tag = self.stack.pop()
                  if open_tag != tag:
                      sys.exit(f"::error::</{tag}> closes <{open_tag}> in index.html")


          parser = Strict()
          parser.feed(open("index.html", encoding="utf-8").read())
          parser.close()
          if parser.stack:
              sys.exit("::error::unclosed tags in index.html: " + ", ".join(parser.stack))
          print("index.html is well formed.")
          PY

          # clubria.repo is copied verbatim rather than rendered, so what matters
          # is that it keeps saying the two things that make the signing in the
          # pages job mean anything. gpgcheck alone would accept a repomd.xml
          # anyone could serve; repo_gpgcheck alone would accept any package a
          # valid index happened to point at.
          repo=packaging/rpm/clubria.repo
          grep -qx 'gpgcheck=1' "$repo"
          grep -qx 'repo_gpgcheck=1' "$repo"

          # The layout the pages job actually builds is $site/rpm/<arch>, and the
          # key it publishes is $site/clubria.asc. A baseurl or gpgkey pointing
          # anywhere else is a repository nobody can install from.
          base=https://clubria.github.io/riabuild
          grep -qx "baseurl=$base/rpm/\$basearch" "$repo"
          grep -qx "gpgkey=$base/clubria.asc" "$repo"

          # And the landing page has to send people to the same place it is
          # served from, or the copy-pasted command installs from nowhere.
          grep -q "$base/rpm/clubria.repo" index.html
          grep -q "$base/deb stable main" index.html
          grep -q "$base/clubria.gpg" index.html

          echo "index.html and clubria.repo render and agree with the pages job."
