name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Both triggers above are webhook-delivered. On 2026-08-06 an Actions incident
  # throttled webhooks for hours: pushes produced no runs at all and there was
  # no way to ask for one, because `gh workflow run` needs this trigger to
  # exist. It goes through the REST API instead, which stayed up throughout.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: riabuild-cli
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: riabuild-cli
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: riabuild-cli

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

  web:
    name: riabuild-web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: riabuild-web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: riabuild-web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint and typecheck
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Fixtures describe an org that does not exist and a dev sign-in that must
      # never ship. They are supposed to fall out with the dead
      # `import.meta.env.DEV` branch — this proves they did.
      - name: No fixtures in the production bundle
        run: |
          set -euo pipefail
          if grep -rlE 'Wolfeschlegelsteinhausenbergerdorff|Fixture scenario|clubria\.test' dist/assets/; then
            echo "::error::Dev fixtures leaked into the production bundle"
            exit 1
          fi
          echo "No fixture data in dist/."

      # Vite inlines `import.meta.env.VITE_CONVEX_URL` at build time, so a build
      # without it makes the guard in main.tsx statically true and Rollup drops
      # the whole Convex client as dead code. That is the right behaviour — the
      # app renders "no backend" instead of a blank page — but it means a deploy
      # that forgets the variable ships a bundle that can never connect and
      # looks perfectly healthy. This proves the configured path still bundles
      # a real client.
      - name: A configured build still contains the Convex client
        run: |
          set -euo pipefail
          VITE_CONVEX_URL="https://ci-placeholder.convex.cloud" pnpm build
          if ! grep -rq 'convex\.cloud' dist/assets/; then
            echo "::error::Convex client missing from a build that had VITE_CONVEX_URL set"
            exit 1
          fi
          echo "Configured build bundles the Convex client."

  ui:
    name: riabuild-web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: riabuild-web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: riabuild-web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Structural assertions only — horizontal overflow, clipping, focus
      # visibility, axe, console errors. Deliberately no committed pixel
      # baselines: font rasterisation differs between a laptop and this
      # container, so a pixel gate would fail forever for reasons unrelated to
      # any change. Judging pixels is the human-in-the-loop step documented in
      # .claude/skills/visual-testing/SKILL.md.
      - name: Visual suite
        run: pnpm ui:check

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: riabuild-web/e2e/__screens__/
          if-no-files-found: warn

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-traces
          path: riabuild-web/e2e/__results__/
          if-no-files-found: ignore

  # The release workflow renders this template only after the GitHub release is
  # already published, so a template that does not parse would leave a released
  # version with a stale tap. Checking it on every pull request is what keeps
  # that from being discovered at release time.
  packaging:
    name: Homebrew formula
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render and validate the formula
        run: |
          set -euo pipefail
          sed \
            -e "s|@VERSION@|0.0.0|g" \
            -e "s|@SHA256_AARCH64@|$(printf 'a%.0s' {1..64})|g" \
            -e "s|@SHA256_X86_64@|$(printf 'b%.0s' {1..64})|g" \
            packaging/homebrew/riabuild.rb > rendered.rb

          if grep -q '@[A-Z0-9_]*@' rendered.rb; then
            echo "::error::Template has a placeholder the release workflow does not substitute:"
            grep -n '@[A-Z0-9_]*@' rendered.rb
            exit 1
          fi

          ruby -c rendered.rb

          # The formula's download URLs must match the names the release
          # workflow actually produces, or `brew install` 404s on a release
          # that otherwise looks healthy.
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            expected="riabuild-0.0.0-$target.tar.gz"
            if ! grep -q "/$expected\"" rendered.rb; then
              echo "::error::Formula does not point at $expected"
              exit 1
            fi
          done
          echo "Formula renders, parses, and points at the artifacts the release builds."
