name: Release

# Cutting a release is `git tag v<x.y.z> && git push --tags`. Everything below
# is what that tag sets off: build both macOS architectures, publish them as a
# GitHub release, and point the Homebrew tap at the result.
#
# The dispatch trigger runs the same build and packaging without publishing, so
# a change to this file can be exercised before a tag depends on it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release and update the tap (otherwise build only)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  # Never cancel: a half-published release is worse than a queued one.
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      sha256_aarch64: ${{ steps.package.outputs.sha256_aarch64 }}
      sha256_x86_64: ${{ steps.package.outputs.sha256_x86_64 }}
    defaults:
      run:
        working-directory: riabuild-cli
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: riabuild-cli

      # The tag is the only place a version is written down — Cargo.toml holds
      # a placeholder, because semver cannot express a zero-padded date. So the
      # thing worth checking is the tag's shape: `v20260804` or `v2026.8.4`
      # would each publish a release that sorts wrongly against every other one
      # for the rest of the project's life.
      - name: Resolve and check version
        id: version
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
            publish=true
          else
            # A dry run has no tag, so it stands in today's date.
            version=$(date -u +%Y.%m.%d)
            publish=${{ inputs.publish }}
          fi

          if ! printf '%s' "$version" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$'; then
            echo "::error::Tag v$version is not a release date."
            echo "::error::Expected vYYYY.MM.DD, zero-padded — for example v$(date -u +%Y.%m.%d)."
            echo "::error::A second release on one day adds a fourth component: v$(date -u +%Y.%m.%d).1"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Releasing riabuild $version (publish=$publish)"

      - name: Test
        run: cargo test --all-targets

      # RIABUILD_VERSION is what cli.rs compiles in. Without it the binary
      # reports the development sentinel, and the verify step below would catch
      # that before anything shipped.
      - name: Build
        env:
          RIABUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      # `strip = "symbols"` can invalidate the ad-hoc signature rustc applies at
      # link time. An arm64 binary with a broken signature is killed by the
      # kernel on launch with no diagnostic beyond "killed: 9", so re-sign both
      # slices after stripping rather than hoping the toolchain preserved it.
      - name: Sign
        run: |
          set -euo pipefail
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            codesign --force --sign - "target/$target/release/riabuild"
            codesign --verify --verbose "target/$target/release/riabuild"
          done

      - name: Verify binaries
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"

          file target/aarch64-apple-darwin/release/riabuild | grep -q 'arm64'
          file target/x86_64-apple-darwin/release/riabuild | grep -q 'x86_64'

          # The runner is arm64, so only that slice can actually be executed
          # here. The x86_64 slice is checked structurally above and by the
          # formula's `test do` block when Homebrew installs it on Intel.
          actual=$(target/aarch64-apple-darwin/release/riabuild --version)
          if [ "$actual" != "riabuild $version" ]; then
            echo "::error::Binary reports '$actual', expected 'riabuild $version'."
            exit 1
          fi

      - name: Package
        id: package
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          mkdir -p dist

          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            arch="${target%%-*}"
            tarball="riabuild-$version-$target.tar.gz"
            # -C so the binary sits at the root of the tarball, which is what
            # the formula's `bin.install "riabuild"` expects.
            tar -czf "dist/$tarball" -C "target/$target/release" riabuild
            sha=$(shasum -a 256 "dist/$tarball" | cut -d' ' -f1)
            echo "sha256_$arch=$sha" >> "$GITHUB_OUTPUT"
            echo "$sha  $tarball" >> "dist/riabuild-$version-checksums.txt"
          done

          cat "dist/riabuild-$version-checksums.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: riabuild-${{ steps.version.outputs.version }}-macos
          path: riabuild-cli/dist/*

      - name: Publish release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          tag="v$version"

          # A dispatch-triggered publish has no tag yet; a tag push already has one.
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "riabuild $version" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi

          gh release upload "$tag" dist/* --clobber

  formula:
    name: Update the Homebrew formula
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      # The release is triggered by a tag, but the formula has to land on the
      # default branch: `brew tap` clones that and reads nothing else. Checking
      # out main rather than the tag is what makes the push below meaningful.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Render formula
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SHA256_AARCH64: ${{ needs.build.outputs.sha256_aarch64 }}
          SHA256_X86_64: ${{ needs.build.outputs.sha256_x86_64 }}
        run: |
          set -euo pipefail
          for placeholder in VERSION SHA256_AARCH64 SHA256_X86_64; do
            if [ -z "${!placeholder}" ]; then
              echo "::error::$placeholder came back empty from the build job."
              exit 1
            fi
          done

          mkdir -p Formula
          sed \
            -e "s|@VERSION@|$VERSION|g" \
            -e "s|@SHA256_AARCH64@|$SHA256_AARCH64|g" \
            -e "s|@SHA256_X86_64@|$SHA256_X86_64|g" \
            packaging/homebrew/riabuild.rb > Formula/riabuild.rb

          if grep -q '@[A-Z0-9_]*@' Formula/riabuild.rb; then
            echo "::error::Formula still contains unsubstituted placeholders:"
            grep -n '@[A-Z0-9_]*@' Formula/riabuild.rb
            exit 1
          fi

          # A formula that does not parse breaks `brew install` for everyone,
          # and nothing before this point would notice. Ruby is preinstalled on
          # the runner, so the check is free.
          ruby -c Formula/riabuild.rb

          cat Formula/riabuild.rb

      - name: Commit the formula to main
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage first, then compare against the index: on the very first
          # release Formula/riabuild.rb is untracked, and `git diff` alone
          # reports no change for a file it does not yet know about — which
          # would silently skip the commit that creates the formula.
          git add Formula/riabuild.rb
          if git diff --cached --quiet; then
            echo "Formula already at $VERSION; nothing to commit."
            exit 0
          fi

          git commit \
            -m "riabuild $VERSION" \
            -m "Written by .github/workflows/release.yml. Edit packaging/homebrew/riabuild.rb, never this file."

          # Anything merged to main while the macOS build was running would
          # otherwise reject this push.
          git pull --rebase origin main
          git push origin HEAD:main
