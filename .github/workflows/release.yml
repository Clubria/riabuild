name: Release

# Cutting a release is `git tag v$(date -u +%Y.%m.%d) && git push --tags`.
# Everything below is what that tag sets off: build macOS and Linux, publish
# them as a GitHub release, point the Homebrew tap and the apt and dnf
# repositories at the result, and tell riabuild-web the version exists so
# developers are actually offered it.
#
# The dispatch trigger runs the same build and packaging without publishing, so
# a change to this file can be exercised before a tag depends on it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release and update the tap (otherwise build only)"
        type: boolean
        default: false

# Nothing by default, and every job below says what it needs.
#
# A workflow-level grant applies to *every* job, and two of the jobs here run
# `cargo build` over the whole dependency tree. A `build.rs` anywhere in that
# graph runs arbitrary code with whatever the job's GITHUB_TOKEN carries — and
# what it carried was `contents: write`, which can push to main and rewrite the
# tag being released, and `id-token: write`, which mints an OIDC token this
# repository's identity is trusted by. Neither build job needs either: they
# check out, compile, and upload an artifact.
#
# So the grants are per job, and the two that hold real authority — `publish`,
# which creates the release, and `formula`, which commits to main — compile
# nothing.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  # Never cancel: a half-published release is worse than a queued one.
  cancel-in-progress: false

jobs:
  # Resolved once and read by every other job. It used to live inside the macOS
  # build, which was fine when that was the only one.
  version:
    name: Resolve the version
    runs-on: ubuntu-latest
    # It reads a tag name out of the event and checks its shape. It does not
    # even check the repository out.
    permissions: {}
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      # The tag is the only place a version is written down — Cargo.toml holds
      # a placeholder, because semver cannot express a zero-padded date. So the
      # thing worth checking is the tag's shape: `v20260804` or `v2026.8.4`
      # would each publish a release that sorts wrongly against every other one
      # for the rest of the project's life.
      - name: Resolve and check version
        id: version
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
            publish=true
          else
            # A dry run has no tag, so it stands in today's date.
            version=$(date -u +%Y.%m.%d)
            publish=${{ inputs.publish }}
          fi

          if ! printf '%s' "$version" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$'; then
            echo "::error::Tag v$version is not a release date."
            echo "::error::Expected vYYYY.MM.DD, zero-padded — for example v$(date -u +%Y.%m.%d)."
            echo "::error::A second release on one day adds a fourth component: v$(date -u +%Y.%m.%d).1"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Releasing riabuild $version (publish=$publish)"

  # One job per slice. Built one after the other in a single job these two took
  # 491 seconds — `lto = true, codegen-units = 1` twice over — and were the
  # release's critical path on their own, with everything downstream of them
  # costing about two minutes between them. Split, the pair costs what the
  # slower leg costs.
  #
  # `fail-fast: false` as in the Linux matrix below: one architecture failing
  # should still report whether the other would have, because "both are broken"
  # and "one is broken" are different releases to recover from.
  macos:
    name: Build macOS ${{ matrix.arch }}
    needs: version
    runs-on: macos-latest
    # Enough to clone and no more. This job compiles the dependency tree, so
    # whatever it holds, every `build.rs` in that tree holds too.
    permissions:
      contents: read
    # Every job that compiles or runs a test carries one of these, because the
    # default is GitHub's six hours and a release is exactly where that is worst:
    # the tag is already pushed and public, so a wedged job is not a slow release
    # but a version that exists and can never be installed. This is what
    # `v2026.08.14` did — one `pump::tests` case stopped answering on macOS and
    # the job sat on it, silently, until it was cancelled by hand. Twenty-five
    # minutes is around five times the longest this job has ever legitimately
    # taken; it is a deadlock detector, not a performance budget.
    #
    # It bounds one slice rather than both since the split below, so there is
    # more headroom than when it was written, and it stays at 25 for that same
    # reason: the number is meant to sit far above anything legitimate, and
    # tightening it towards a real duration is what turns a deadlock detector
    # into a performance budget that fails on a slow runner.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
            # `file` calls this slice arm64 where the triple spells it aarch64.
            file_arch: arm64
            # The runners are arm64, so this is the only leg that can execute
            # what it just built.
            native: true
          - arch: x86_64
            target: x86_64-apple-darwin
            file_arch: x86_64
            native: false
    defaults:
      run:
        working-directory: riabuild-cli
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Keyed per target, exactly as the Linux matrix is. Two legs sharing one
      # cache key race to save different targets into it, and whichever lands
      # last is what both restore next release.
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          cache-key: ${{ matrix.target }}

      # Once, on the leg whose runner can run what it compiles: there is nothing
      # to learn from running one suite twice on one machine against one host
      # architecture, so the x86_64 leg skips it.
      #
      # It stays here at all even though `ci.yml`'s `cli-macos` job now runs the
      # same suite on macOS for every pull request. That one exists to catch a
      # Mac-only failure *before* a tag; this one is the last gate after the tag
      # is already public, which is the failure that job's comment describes and
      # the reason a second run is worth its five minutes.
      - name: Test
        if: matrix.native
        run: cargo test --workspace --all-targets

      # RIABUILD_VERSION is what cli.rs compiles in. Without it the binary
      # reports the development sentinel, and the verify step below would catch
      # that before anything shipped.
      - name: Build
        env:
          RIABUILD_VERSION: ${{ env.VERSION }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      # `strip = "symbols"` can invalidate the ad-hoc signature rustc applies at
      # link time. An arm64 binary with a broken signature is killed by the
      # kernel on launch with no diagnostic beyond "killed: 9", so re-sign after
      # stripping rather than hoping the toolchain preserved it.
      - name: Sign
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/riabuild"
          codesign --force --sign - "$binary"
          codesign --verify --verbose "$binary"

      - name: Verify the binary is the architecture it claims
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/riabuild"
          file "$binary"
          file "$binary" | grep -q '${{ matrix.file_arch }}'

      # Only the native slice can be executed here. The x86_64 one is checked
      # structurally above, and by the formula's `test do` block when Homebrew
      # installs it on an Intel Mac.
      - name: Verify the binary reports this version
        if: matrix.native
        run: |
          set -euo pipefail
          actual=$(target/${{ matrix.target }}/release/riabuild --version)
          if [ "$actual" != "riabuild $VERSION" ]; then
            echo "::error::Binary reports '$actual', expected 'riabuild $VERSION'."
            exit 1
          fi

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          tarball="riabuild-$VERSION-${{ matrix.target }}.tar.gz"
          # -C so the binary sits at the root of the tarball, which is what the
          # formula's `bin.install "riabuild"` expects.
          tar -czf "dist/$tarball" -C "target/${{ matrix.target }}/release" riabuild

          # Logged for whoever is reading the run, and read from here by
          # nothing. The published checksums file is assembled in `publish` and
          # the formula's two digests are computed in `formula`, both from the
          # uploaded artifact — see `formula` for why a matrix job cannot hand
          # them over as job outputs.
          shasum -a 256 "dist/$tarball"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: riabuild-macos-${{ matrix.arch }}
          path: riabuild-cli/dist/*

  # Static musl, so there is no glibc floor and one build runs on every
  # distribution and release. The failure this avoids is `version GLIBC_2.35 not
  # found` on an older machine: a message that says nothing about riabuild and
  # cannot be fixed by the developer reading it.
  #
  # Built natively on each architecture rather than cross-compiled, which keeps
  # `ring` — the only crate here with C in it — building against a musl
  # compiler that is simply the host's.
  linux:
    name: Build Linux ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    # As the macOS job: read, because it compiles the dependency tree.
    permissions:
      contents: read
    # The same deadlock detector as the macOS job above, and for the same reason.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            deb_arch: amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            deb_arch: arm64
    defaults:
      run:
        working-directory: riabuild-cli
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          cache-key: ${{ matrix.target }}

      # `ring` builds C, and cc-rs looks for `<arch>-linux-musl-gcc` — a name
      # Ubuntu's musl-tools does not provide; it ships `musl-gcc`. Without this
      # the build fails outright with `failed to find tool`, which is at least
      # loud. Pointing it at the host's glibc `cc` instead would be the quiet
      # version of the same mistake.
      #
      # Written to $GITHUB_ENV once rather than exported in each step that
      # builds. Two reasons, and the second is why the first release failed:
      #
      #   * cc-rs and Cargo want different spellings of the same target, and
      #     repeating both transformations is how they drift apart.
      #   * cc-rs accepts `CC_<target>` with hyphens, but that is not a valid
      #     shell identifier, so `export CC_x86_64-unknown-linux-musl=…` is a
      #     hard error before a single crate compiles. $GITHUB_ENV takes
      #     `NAME=value` literally and never had that restriction; the
      #     underscore spelling below is the one cc-rs also accepts.
      - name: Install the musl toolchain
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y musl-tools

          target_cc=$(printf '%s' "${{ matrix.target }}" | tr '-' '_')
          target_env=$(printf '%s' "${{ matrix.target }}" | tr 'a-z-' 'A-Z_')
          echo "CC_${target_cc}=musl-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_${target_env}_LINKER=musl-gcc" >> "$GITHUB_ENV"

      - name: Build
        env:
          RIABUILD_VERSION: ${{ env.VERSION }}
        run: |
          set -euo pipefail
          cargo build --release --locked --target ${{ matrix.target }}

      - name: Verify the binary is static and runs
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/riabuild"

          # rustc produces a static-PIE for musl, which `file` describes as
          # "static-pie linked" rather than "statically linked" — so both spellings
          # are accepted, and `ldd` is asked as well because it answers the
          # question that actually matters.
          file "$binary"
          file "$binary" | grep -Eq 'static-pie linked|statically linked'
          if ldd "$binary" 2>&1 | grep -vq 'not a dynamic executable\|statically linked'; then
            echo "::error::$binary is dynamically linked:"
            ldd "$binary"
            exit 1
          fi

          # Both architectures run natively here, so neither is checked only
          # structurally the way the macOS x86_64 slice has to be.
          actual=$("$binary" --version)
          if [ "$actual" != "riabuild $VERSION" ]; then
            echo "::error::Binary reports '$actual', expected 'riabuild $VERSION'."
            exit 1
          fi

      # A static binary that builds, links, and reports its version can still be
      # unable to reach anything: `rustls-tls-native-roots` has to find a
      # certificate store, and musl's resolver is not glibc's. Neither is visible
      # without making a real request, and neither would be found until a
      # developer ran it.
      - name: Prove TLS and DNS work in this build
        env:
          RIABUILD_VERSION: ${{ env.VERSION }}
        run: |
          set -euo pipefail
          # `-p riabuild-fetch` rather than the whole workspace: `download`
          # lives there now, and without it this builds thirteen test binaries
          # under LTO on the release critical path to run one test.
          out=$(cargo test --release --locked --target ${{ matrix.target }} \
            -p riabuild-fetch -- --ignored --exact \
            download::tests::tls_and_dns_work_on_this_build 2>&1 | tee /dev/stderr)
          # libtest exits 0 when a filter matches nothing, so the exit code
          # alone would let a renamed module turn this release-gating proof
          # into a silent no-op.
          grep -q '1 passed' <<<"$out"

      - name: Install packaging tools
        run: sudo apt-get install -y rpm

      # Packaged here, on the architecture it was built for, rather than in one
      # job from both binaries. `rpmbuild --target aarch64` on an x86_64 host
      # fails with "No compatible architectures found for build" — and so does
      # `rpmspec -P`, so the spec cannot even be parsed there. Each runner
      # packaging what it just built sidesteps that entirely, and has the useful
      # side effect that the install test below runs natively too.
      #
      # The rendering, the dpkg-deb and rpmbuild invocations, the metadata
      # assertions and the container install test all used to be written out
      # here *and* in ci.yml, and the two copies had drifted: only this one
      # checked the deb's Architecture field and its copyright file, and only
      # ci.yml checked that the rpm still declares `Requires: git`. They are one
      # pair of scripts now, so neither workflow can quietly lose a check the
      # other has.
      - name: Build the packages
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p dist

          # A plain tarball too, for anyone not using a package manager. Not the
          # packaging scripts' business: it is the same binary with no metadata
          # around it.
          tar -czf "dist/riabuild-$VERSION-${{ matrix.target }}.tar.gz" \
            -C "riabuild-cli/target/${{ matrix.target }}/release" riabuild

          packaging/build-packages.sh \
            --version "$VERSION" \
            --binary "riabuild-cli/target/${{ matrix.target }}/release/riabuild" \
            --deb-arch "${{ matrix.deb_arch }}" \
            --rpm-arch "${{ matrix.arch }}"

      # Everything above this line can pass while the package still installs
      # something that will not start, so --containers puts the real binary
      # through a real package manager on the architecture it was built for.
      - name: Verify the packages
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          packaging/verify-packages.sh \
            --version "$VERSION" \
            --deb "dist/riabuild_${VERSION}_${{ matrix.deb_arch }}.deb" \
            --deb-arch "${{ matrix.deb_arch }}" \
            --rpm "dist/riabuild-$VERSION-1.${{ matrix.arch }}.rpm" \
            --rpm-arch "${{ matrix.arch }}" \
            --containers

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: riabuild-linux-${{ matrix.arch }}
          path: dist/*

  publish:
    name: Publish the GitHub release
    needs: [version, macos, linux]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # The one job that creates a release, and the one that attests to what it
    # published. `id-token` and `attestations` are what
    # actions/attest-build-provenance signs with; nothing is compiled here, so
    # no third-party code is in reach of them.
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
      # The same key the apt and dnf repositories are signed with. It is here so
      # the checksums file gets the same treatment the package indexes already
      # get; see "Sign the checksums" below.
      SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
      SIGNING_KEY_ID: ${{ secrets.PACKAGE_SIGNING_KEY_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: riabuild-*
          path: dist
          merge-multiple: true

      # `riabuild remote` fetches this file *before* the tarball and refuses to
      # install a binary it has no digest for. That is the right way round, and
      # it means a missing line here is not a cosmetic gap: it is a platform
      # riabuild cannot provision at all. It was built in the macOS job until
      # now, so the published file listed the two darwin tarballs and neither
      # musl one, and `riabuild remote <a linux server>` failed closed on every
      # release since Linux packaging landed.
      #
      # It has to be assembled here rather than appended to per-job: the three
      # build jobs upload into one merged directory (`merge-multiple: true`),
      # so three of them writing one file is a race whose winner is whichever
      # artifact unpacked last.
      #
      # The expected set is spelled out rather than inferred from what happens
      # to be in `dist/`, because the failure being fixed is *a missing entry* —
      # and a check that only counts what it finds agrees with itself no matter
      # how little that is.
      - name: Assemble the checksums
        run: |
          set -euo pipefail
          cd dist
          checksums="riabuild-$VERSION-checksums.txt"
          rm -f "$checksums"

          for target in \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            aarch64-unknown-linux-musl \
            x86_64-unknown-linux-musl
          do
            tarball="riabuild-$VERSION-$target.tar.gz"
            if [ ! -f "$tarball" ]; then
              echo "::error::$tarball is missing — riabuild could not install itself on $target."
              exit 1
            fi
            sha256sum "$tarball" >> "$checksums"
          done

          cat "$checksums"

      # The apt and dnf repositories are signed with this key and the GitHub
      # release was not, which is the odd way round: `remote/src/install.rs`
      # fetches `checksums.txt` over plain HTTPS and then trusts every digest in
      # it, so whoever can serve that file chooses which bytes riabuild installs
      # on a server. The key is already published at
      # clubria.github.io/riabuild/clubria.asc for the repositories, so
      # verifying this needs nothing new distributed.
      #
      # Guarded on the secret rather than required, matching how `announce`
      # treats CONVEX_DEPLOY_KEY: a release that is unsigned is worse than one
      # that is signed and better than one that never happened.
      - name: Sign the checksums
        if: env.SIGNING_KEY != '' && env.SIGNING_KEY_ID != ''
        run: |
          set -euo pipefail
          printf '%s' "$SIGNING_KEY" | gpg --batch --import
          gpg --batch --yes --local-user "$SIGNING_KEY_ID" \
            --detach-sign --armor \
            -o "dist/riabuild-$VERSION-checksums.txt.asc" \
            "dist/riabuild-$VERSION-checksums.txt"
          gpg --verify "dist/riabuild-$VERSION-checksums.txt.asc" \
            "dist/riabuild-$VERSION-checksums.txt"

      - name: Note that the checksums were not signed
        if: env.SIGNING_KEY == '' || env.SIGNING_KEY_ID == ''
        run: |
          echo "::warning::PACKAGE_SIGNING_KEY is not set, so checksums.txt was published"
          echo "::warning::unsigned. Anything that can serve that file chooses which bytes"
          echo "::warning::riabuild installs. See docs/releasing.md for the key setup."

      # Provenance for every artifact in the release: which workflow, at which
      # commit, on which runner, built these exact bytes. Verified with
      # `gh attestation verify <file> --repo Clubria/riabuild`, and it is what
      # `id-token: write` on this job is for — the permission was granted
      # workflow-wide and used by nothing at all before this.
      #
      # Attested before the release stops being a draft, so nothing is public
      # and unattested even for a moment.
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/riabuild-*-checksums.txt

      # Created as a draft and published at the very end.
      #
      # `gh release create` publishes the moment it returns, and the upload came
      # afterwards — so between the two there was a real, visible release with no
      # tarballs and no checksums file behind it. `remote/src/install.rs` fetches
      # the checksums first and fails closed when it cannot find a digest, so a
      # `riabuild remote` landing in that window does not merely wait: it reports
      # that it cannot install the version it can plainly see.
      - name: Publish
        run: |
          set -euo pipefail
          tag="v$VERSION"

          # A dispatch-triggered publish has no tag yet; a tag push already has one.
          # A re-run after a failure finds a release either way, draft or not.
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "riabuild $VERSION" \
              --generate-notes \
              --draft \
              --target "$GITHUB_SHA"
          fi

          ls -l dist/
          gh release upload "$tag" dist/* --clobber

          # Everything is uploaded; only now does the release exist for anyone
          # else. Unconditional rather than conditional on having just created
          # it, so a re-run that repairs a half-uploaded draft also publishes it.
          gh release edit "$tag" --draft=false

  formula:
    name: Update the Homebrew formula
    needs: [version, macos, publish]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # Commits Formula/riabuild.rb to main. Nothing is compiled here either.
    permissions:
      contents: write
    steps:
      # The release is triggered by a tag, but the formula has to land on a
      # default branch: Homebrew clones a tap's and reads nothing else. Checking
      # out main rather than the tag is what makes the pushes below meaningful.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main

      # The two darwin digests arrived as `macos` job outputs until the build
      # became a matrix. A matrix job has *one* set of outputs shared by every
      # leg, so both legs would write the same two keys and whichever finished
      # last would win — quietly, and leaving a real, correctly-formed sha256
      # for the wrong architecture in a formula that parses perfectly. Computing
      # them here instead has no such race, and has each digest describe the
      # bytes that were actually published rather than the ones a build job
      # reported having.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: riabuild-macos-*
          path: dist
          merge-multiple: true

      - name: Render formula
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail

          # Named explicitly rather than globbed, for the reason `publish`
          # spells out: the failure worth catching is a *missing* tarball, and
          # a step that works from whatever it happens to find agrees with
          # itself no matter how little that is.
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            tarball="dist/riabuild-$VERSION-$target.tar.gz"
            if [ ! -f "$tarball" ]; then
              echo "::error::$tarball is missing — the macOS $target leg never uploaded it."
              exit 1
            fi
          done

          SHA256_AARCH64=$(sha256sum "dist/riabuild-$VERSION-aarch64-apple-darwin.tar.gz" | cut -d' ' -f1)
          SHA256_X86_64=$(sha256sum "dist/riabuild-$VERSION-x86_64-apple-darwin.tar.gz" | cut -d' ' -f1)

          for placeholder in VERSION SHA256_AARCH64 SHA256_X86_64; do
            if [ -z "${!placeholder}" ]; then
              echo "::error::$placeholder came back empty from the build job."
              exit 1
            fi
          done

          mkdir -p Formula
          sed \
            -e "s|@VERSION@|$VERSION|g" \
            -e "s|@SHA256_AARCH64@|$SHA256_AARCH64|g" \
            -e "s|@SHA256_X86_64@|$SHA256_X86_64|g" \
            packaging/homebrew/riabuild.rb > Formula/riabuild.rb

          if grep -q '@[A-Z0-9_]*@' Formula/riabuild.rb; then
            echo "::error::Formula still contains unsubstituted placeholders:"
            grep -n '@[A-Z0-9_]*@' Formula/riabuild.rb
            exit 1
          fi

          # A formula that does not parse breaks `brew install` for everyone,
          # and nothing before this point would notice. Ruby is preinstalled on
          # the runner, so the check is free.
          ruby -c Formula/riabuild.rb

          cat Formula/riabuild.rb

      # `Clubria/homebrew-tap` is what `brew install clubria/tap/riabuild`
      # reaches for without being asked. Homebrew derives a repository name from
      # the tap name `clubria/tap` and the name it derives is
      # `Clubria/homebrew-tap`, which is the entire reason that repository
      # exists and the entire reason the install instructions no longer carry a
      # `brew tap` line.
      #
      # It is pushed *before* the commit to this repository because it is now
      # the channel a new laptop installs from: if only one of the two can
      # land, it should be that one.
      - name: Publish the formula to the tap repository
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail

          # A missing token would otherwise leave the tap serving the previous
          # release indefinitely, with this job still green — the failure mode
          # is a release nobody can install, reported as a success.
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is unset — Clubria/homebrew-tap would keep serving the previous release."
            exit 1
          fi

          # Cloned anonymously and pushed with the token supplied on the command
          # line, so no credential is written into the clone's .git/config.
          git clone --depth 1 https://github.com/Clubria/homebrew-tap.git "$RUNNER_TEMP/tap"

          mkdir -p "$RUNNER_TEMP/tap/Formula"
          cp Formula/riabuild.rb "$RUNNER_TEMP/tap/Formula/riabuild.rb"

          git -C "$RUNNER_TEMP/tap" config user.name "github-actions[bot]"
          git -C "$RUNNER_TEMP/tap" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git -C "$RUNNER_TEMP/tap" add Formula/riabuild.rb
          if git -C "$RUNNER_TEMP/tap" diff --cached --quiet; then
            echo "Tap already at $VERSION; nothing to push."
            exit 0
          fi

          git -C "$RUNNER_TEMP/tap" commit \
            -m "riabuild $VERSION" \
            -m "Written by Clubria/riabuild .github/workflows/release.yml. Edit packaging/homebrew/riabuild.rb there, never this file."

          git -C "$RUNNER_TEMP/tap" push \
            "https://x-access-token:${TAP_TOKEN}@github.com/Clubria/homebrew-tap.git" HEAD:main

      # The copy in this repository is kept in step with the tap rather than
      # retired with it. A laptop that ran the old explicit
      # `brew tap clubria/tap https://github.com/Clubria/riabuild` has a git
      # remote pointing here, and `brew upgrade` against a tap that stopped
      # changing keeps reporting success while never finding a new version.
      # Dropping this step is safe only once no developer is on that remote.
      - name: Commit the formula to main
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage first, then compare against the index: on the very first
          # release Formula/riabuild.rb is untracked, and `git diff` alone
          # reports no change for a file it does not yet know about — which
          # would silently skip the commit that creates the formula.
          git add Formula/riabuild.rb
          if git diff --cached --quiet; then
            echo "Formula already at $VERSION; nothing to commit."
            exit 0
          fi

          git commit \
            -m "riabuild $VERSION" \
            -m "Written by .github/workflows/release.yml. Edit packaging/homebrew/riabuild.rb, never this file."

          # Anything merged to main while the macOS build was running would
          # otherwise reject this push.
          git pull --rebase origin main
          git push origin HEAD:main

  # Whether the apt and dnf repositories can be signed at all, answered once and
  # published as a job output.
  #
  # This was a step inside `pages`, with its answer repeated as an `if:` on the
  # ten steps that followed. With the key unset all ten skipped and the job
  # reported *green* — a release that published no apt repository and no dnf
  # repository, and said so only in a warning. That is the silent success the
  # `announce` job's own check exists to prevent, and it is also why the body of
  # `pages` was unreadable.
  #
  # It cannot simply become a job-level `if:` on `pages`, because the `secrets`
  # context is not available there — only `needs`, `github`, `vars` and `inputs`
  # are. A job that can read the secret answers the question instead, and `pages`
  # gates on the answer, so an unsigned release now reports "skipped".
  signing:
    name: Check the package signing key
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    env:
      SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
      SIGNING_KEY_ID: ${{ secrets.PACKAGE_SIGNING_KEY_ID }}
    steps:
      - name: Check the signing key is configured
        id: check
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEY" ] || [ -z "$SIGNING_KEY_ID" ]; then
            echo "::warning::PACKAGE_SIGNING_KEY is not set, so the apt and dnf"
            echo "::warning::repositories will NOT be updated. The release will be on"
            echo "::warning::GitHub, but no Linux developer will be offered it."
            echo "::warning::See docs/releasing.md for the one-time key setup."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  # The apt and dnf repositories, rebuilt from the newest few GitHub releases
  # and deployed to Pages.
  #
  # Runs only when `signing` says the key is there; see that job for why the
  # guard lives outside this one.
  #
  # Rebuilt rather than appended to, which is what keeps this cheap: nothing is
  # stored between runs, so there is no branch accumulating every package ever
  # released into every clone of this repository, and a repository that somehow
  # ends up corrupt is repaired by re-running the job rather than by hand.
  pages:
    name: Publish the apt and dnf repositories
    needs: [version, publish, signing]
    if: needs.version.outputs.publish == 'true' && needs.signing.outputs.configured == 'true'
    runs-on: ubuntu-latest
    # `contents: read` for the `gh release download` that collects the packages;
    # `pages` and `id-token` are what actions/deploy-pages needs, and this is
    # the only job that deploys.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
      SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
      SIGNING_KEY_ID: ${{ secrets.PACKAGE_SIGNING_KEY_ID }}
      # How many releases the repositories serve. Enough that someone who
      # pinned a recent version can still install it, few enough that the
      # published site stays small.
      KEEP: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils createrepo-c rpm

      - name: Import the signing key
        run: |
          set -euo pipefail
          printf '%s' "$SIGNING_KEY" | gpg --batch --import

          # rpmsign drives gpg without a terminal, so a key with a passphrase
          # would hang here waiting for a pinentry that can never appear. The
          # key lives in a repository secret, which is the thing actually
          # protecting it; a passphrase beside it in a second secret adds
          # nothing and takes the build down.
          if ! echo test | gpg --batch --pinentry-mode error \
              --local-user "$SIGNING_KEY_ID" --sign --output /dev/null 2>/dev/null; then
            echo "::error::The signing key needs a passphrase, which cannot be supplied here."
            echo "::error::Generate a passphrase-less key — see docs/releasing.md."
            exit 1
          fi

          # rpm 4.14 — RHEL 8 and its rebuilds — cannot verify an ed25519
          # signature, and reports the failure as `digests SIGNATURES NOT OK`,
          # which dnf shows as a corrupt package. Nothing in this workflow would
          # notice: signing succeeds, the repository publishes, and only a RHEL 8
          # machine finds out. GnuPG 2.4 generates ed25519 by default, so this is
          # one wrong flag away on any future rotation.
          #
          # Field 4 of a `sec:` record is the OpenPGP algorithm id. 1 is RSA.
          algo=$(gpg --list-keys --with-colons "$SIGNING_KEY_ID" \
            | awk -F: '/^pub:/ {print $4; exit}')
          if [ "$algo" != "1" ]; then
            echo "::error::The signing key is not RSA (OpenPGP algorithm id $algo)."
            echo "::error::RHEL 8 cannot verify it and will call the package corrupt."
            echo "::error::Generate the key with rsa4096, not default — see docs/releasing.md."
            exit 1
          fi

          echo "%_gpg_name $SIGNING_KEY_ID" > ~/.rpmmacros

      - name: Collect the newest releases
        run: |
          set -euo pipefail
          mkdir -p packages

          # Ordered by the tag rather than by publish date: a re-published or
          # back-filled release should still sort by the date it names.
          tags=$(gh release list --limit 50 --json tagName --jq '.[].tagName' \
            | grep -E '^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$' \
            | sort -Vr | head -n "$KEEP")

          if [ -z "$tags" ]; then
            echo "::error::No released versions found to build a repository from."
            exit 1
          fi

          echo "Serving these versions:"
          printf '%s\n' "$tags"

          for tag in $tags; do
            # Releases from before Linux support have no packages; they are
            # skipped rather than failing the run.
            gh release download "$tag" --dir packages --pattern '*.deb' --skip-existing || true
            gh release download "$tag" --dir packages --pattern '*.rpm' --skip-existing || true
          done

          if ! ls packages/*.deb >/dev/null 2>&1; then
            echo "::error::No .deb files were downloaded; the apt repository would be empty."
            exit 1
          fi
          ls -l packages/

      - name: Build the apt repository
        run: |
          set -euo pipefail
          site=site
          mkdir -p "$site/deb/pool/main/r/riabuild"
          cp packages/*.deb "$site/deb/pool/main/r/riabuild/"

          cd "$site/deb"
          for arch in amd64 arm64; do
            mkdir -p "dists/stable/main/binary-$arch"
            # Run from the repository root so the `Filename:` field is relative
            # to it — an absolute or runner-local path here produces an index
            # that resolves to nothing on a developer's machine.
            apt-ftparchive --arch "$arch" packages pool \
              > "dists/stable/main/binary-$arch/Packages"
            gzip -9kf "dists/stable/main/binary-$arch/Packages"
          done

          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=Clubria \
            -o APT::FTPArchive::Release::Label=riabuild \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures="amd64 arm64" \
            -o APT::FTPArchive::Release::Components=main \
            release dists/stable > dists/stable/Release

          # InRelease is the clearsigned form apt prefers; Release.gpg is the
          # detached signature older clients look for. Both, because serving
          # only one is a difference nobody notices until someone's apt is the
          # other kind.
          gpg --batch --yes --local-user "$SIGNING_KEY_ID" \
            --clearsign -o dists/stable/InRelease dists/stable/Release
          gpg --batch --yes --local-user "$SIGNING_KEY_ID" \
            -abs -o dists/stable/Release.gpg dists/stable/Release

          echo "apt repository:"
          find . -type f | sort

      - name: Build the dnf repository
        run: |
          set -euo pipefail
          site=site

          for arch in x86_64 aarch64; do
            dir="$site/rpm/$arch"
            mkdir -p "$dir"
            # `|| true` because a repository may legitimately have no package
            # for one architecture yet; createrepo_c is happy with an empty one.
            cp packages/*."$arch".rpm "$dir/" 2>/dev/null || true

            # Sign the packages themselves, not just the index. gpgcheck=1 in
            # clubria.repo is meaningless without this, and repo_gpgcheck alone
            # would accept any package a valid index pointed at.
            if ls "$dir"/*.rpm >/dev/null 2>&1; then
              rpmsign --addsign "$dir"/*.rpm
              # A real file, not a process substitution: `rpm --import <(…)`
              # fails with `import read failed(0)` because rpm seeks the file it
              # is given, and a pipe cannot be seeked.
              gpg --export --armor "$SIGNING_KEY_ID" > key.asc
              rpm --import key.asc
              rpm --checksig "$dir"/*.rpm
            fi

            createrepo_c "$dir"
            gpg --batch --yes --local-user "$SIGNING_KEY_ID" \
              --detach-sign --armor "$dir/repodata/repomd.xml"
          done

          cp packaging/rpm/clubria.repo "$site/rpm/clubria.repo"

          echo "dnf repository:"
          find "$site/rpm" -type f | sort

      - name: Publish the key and the landing page
        run: |
          set -euo pipefail
          site=site

          # Both forms. apt's `signed-by` wants a dearmoured keyring; dnf's
          # `gpgkey` wants the armoured one.
          gpg --export "$SIGNING_KEY_ID" > "$site/clubria.gpg"
          gpg --export --armor "$SIGNING_KEY_ID" > "$site/clubria.asc"

          sed -e "s|@VERSION@|$VERSION|g" packaging/pages/index.html.in > "$site/index.html"
          if grep -q '@[A-Z0-9_]*@' "$site/index.html"; then
            echo "::error::index.html still contains unsubstituted placeholders."
            exit 1
          fi

          # Pages otherwise runs the whole site through Jekyll, which skips
          # files and directories beginning with an underscore and would quietly
          # drop parts of a repository index.
          touch "$site/.nojekyll"

      # The repositories are only useful if a real package manager accepts them.
      # A broken Release signature, a wrong `Filename:` path, or an architecture
      # mismatch all produce a site that looks perfectly healthy in this log and
      # fails on the developer's first command.
      - name: Install from the repositories in a real container
        env:
          # Pinned by digest, not by tag. `debian:12` is whatever was pushed
          # under that name this morning, and this step is a *gate*: it exists to
          # say that a specific apt and a specific dnf accept what was just
          # built. The Rocky 8 leg is the sharpest case — it is here because rpm
          # 4.14 cannot verify an ed25519 signature and calls such a package
          # corrupt, which is exactly the behaviour a retag can change out from
          # under the assertion that was written to catch it.
          DEBIAN: "debian:12@sha256:813017f3d62be4b5891a7acca6a01bdcd4b8513daa81b1ab99d3a50385b26931"
          FEDORA: "fedora:41@sha256:f1a3fab47bcb3c3ddf3135d5ee7ba8b7b25f2e809a47440936212a3a50957f3d"
          ROCKY: "rockylinux:8@sha256:9794037624aaa6212aeada1d28861ef5e0a935adaf93e4ef79837119f2a2d04c"
        run: |
          set -euo pipefail
          ( cd site && python3 -m http.server 8080 & )
          sleep 2

          docker run --rm --network host -v "$PWD/site:/site:ro" "$DEBIAN" bash -eux -c '
            apt-get update -qq && apt-get install -y -qq curl gnupg >/dev/null
            cp /site/clubria.gpg /usr/share/keyrings/clubria.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/clubria.gpg] http://127.0.0.1:8080/deb stable main" \
              > /etc/apt/sources.list.d/clubria.list
            apt-get update
            apt-get install -y riabuild
            riabuild --version
          '

          # Fedora for the newest rpm, Rocky 8 for the oldest one still in
          # support. They disagree about which signatures they accept: rpm 4.14
          # on Rocky 8 cannot verify ed25519 and calls such a package corrupt,
          # while Fedora takes it happily. Testing only the newer one would
          # publish a repository that half the RPM world silently rejects.
          for image in "$FEDORA" "$ROCKY"; do
            docker run --rm --network host -v "$PWD/site:/site:ro" "$image" bash -eux -c '
              rpm --import /site/clubria.asc
              sed "s|https://clubria.github.io/riabuild|http://127.0.0.1:8080|" \
                /site/rpm/clubria.repo > /etc/yum.repos.d/clubria.repo
              dnf install -y riabuild
              riabuild --version
            '
          done

          echo "apt and dnf both installed riabuild from the generated repositories."

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        id: deploy

  announce:
    name: Offer the release to developers
    needs: [version, publish]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: riabuild-web
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/setup-pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # A published release nobody is offered is invisible: the CLI reads the
      # version to upgrade to from /api/v1/org/config, never from GitHub. This
      # is the step that turns a GitHub release into something developers see.
      #
      # publishCliVersion re-checks with GitHub that the release really exists
      # before writing, so this cannot announce a version that was not shipped.
      - name: Publish the version to riabuild-web
        if: env.CONVEX_DEPLOY_KEY != ''
        run: |
          set -euo pipefail
          case "$CONVEX_DEPLOY_KEY" in
            prod:*) ;;
            *)
              echo "::error::CONVEX_DEPLOY_KEY targets '${CONVEX_DEPLOY_KEY%%:*}', not production."
              exit 1
              ;;
          esac

          # The release was created moments ago in the publish job; give
          # api.github.com a little room before deciding it does not exist.
          for attempt in 1 2 3; do
            if npx convex run release:publishCliVersion "{\"version\":\"$VERSION\"}"; then
              exit 0
            fi
            echo "attempt $attempt failed, retrying…"
            sleep 10
          done
          echo "::error::Could not publish $VERSION to riabuild-web."
          echo "::error::The release is out; set Latest CLI version in the lead panel."
          exit 1

      - name: Note that the version was not published
        if: env.CONVEX_DEPLOY_KEY == ''
        run: |
          echo "::warning::CONVEX_DEPLOY_KEY is not set, so $VERSION was NOT offered to anyone."
          echo "::warning::The release exists on GitHub, but every CLI still reads the old"
          echo "::warning::latestCliVersion. Set it in the dashboard's lead panel."
